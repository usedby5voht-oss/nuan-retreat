/* Home: full-screen slider, booking panel on its lower edge, then the house, rooms, a day at Nuan, experiences, offers, pictures and location. */
.hero{position:relative;height:100svh;min-height:640px;max-height:1040px;background:var(--night);color:#fff;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{position:absolute;inset:0;transform:scale(1.08);transition:transform 8s ease-out}
.slide.on img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0F1D1Ab3 0%,#0F1D1A00 30%,#0F1D1A00 48%,#0F1D1Af0 100%);pointer-events:none;z-index:1}
.cap{position:absolute;left:0;right:0;bottom:clamp(170px,22vh,230px);z-index:2}
.cap .k{font-size:14px;letter-spacing:.06em;color:var(--brass2);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.cap .k::before{content:"";width:34px;height:1px;background:var(--brass2)}
.cap h1,.cap h2{font-size:clamp(42px,6.4vw,96px);font-weight:300;max-width:15ch;line-height:1.14}
.cap .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.sctl{position:absolute;z-index:3;right:max(5vw,20px);bottom:clamp(170px,22vh,230px);display:flex;align-items:center;gap:16px;color:#fff}
.dots{display:flex;gap:6px}
.dots button{width:40px;height:44px;border:0;background:none;cursor:pointer;padding:0;position:relative}
.dots button::before{content:"";position:absolute;left:0;right:0;top:21px;height:1px;background:#ffffff59}
.dots button[aria-current=true]::before{background:var(--brass2);height:2px;top:20px}
.count{font:300 15px var(--f-d);min-width:56px;text-align:right;letter-spacing:.06em}
.bkb{position:absolute;z-index:4;left:0;right:0;bottom:0}
.bkf{background:var(--paper);color:var(--ink);display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:stretch;box-shadow:0 -10px 40px #0F1D1A33}
.bkf .field{padding:22px 28px;border-right:1px solid var(--line)}
.bkf .btn{min-height:auto;padding:0 44px;border-radius:0;font-size:16px}
.intro{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(40px,7vw,120px);align-items:center}
.pair{display:grid;grid-template-columns:3fr 2fr;gap:18px;align-items:end}
.pair figure:first-child{aspect-ratio:3/4.2;border-radius:var(--arch)}.pair figure:last-child{aspect-ratio:3/4;margin-bottom:72px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.facts b{display:block;font:300 clamp(30px,3vw,44px)/1.1 var(--f-d);color:var(--brassd)}.facts span{font-size:13.5px;color:var(--mute)}
.rcard{text-decoration:none;display:block;color:#fff}
.rcard figure{aspect-ratio:3/4;border-radius:var(--arch)}
.rcard img{transition:transform 1.1s ease}.rcard:hover img{transform:scale(1.045)}
.rcard .rm{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-top:22px;flex-wrap:wrap}
.rcard h3{font-size:26px;font-weight:300}
.rcard p{color:var(--fog);font-size:14.5px;margin-top:6px}
.rcard .pr{white-space:nowrap;font-size:14px;color:var(--fog)}.rcard .pr b{font:400 22px var(--f-d);color:var(--brass2)}
.day .dayh{max-width:760px;margin:0 auto clamp(56px,7vw,96px)}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.stop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(48px,8vw,140px);align-items:center;padding:30px 0;position:relative}
.stop::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1.5px solid var(--brass);transform:translate(-50%,-50%)}
.stop.sun::after{background:var(--brass)}
.stop figure{aspect-ratio:4/3.2}
.stop:nth-child(odd) figure{border-radius:var(--arch);aspect-ratio:4/4.6}
.stop:nth-child(even) figure{order:2}
.time{font:300 48px/1 var(--f-d);color:var(--ink);margin-bottom:14px;white-space:nowrap}
.stop.sun .time{color:var(--brassd)}
.stop p{color:var(--mute);margin-top:10px;max-width:42ch}
.stop .note{font-size:13.5px;color:var(--brassd);margin-top:14px}
.xgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.xt{position:relative;display:block;aspect-ratio:3/4.4;overflow:hidden;color:#fff;text-decoration:none;background:var(--night)}
.xt:nth-child(even){margin-top:56px}
.xt img{position:absolute;inset:0;transition:transform 1.2s ease,opacity .4s}
.xt:hover img{transform:scale(1.06);opacity:.85}
.xt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0F1D1A00 40%,#0F1D1Ae6 100%)}
.xt div{position:absolute;left:24px;right:24px;bottom:24px;z-index:2}
.xt h3{font-size:clamp(22px,2vw,28px);font-weight:300}
.xt p{font-size:14px;color:#D9E0DC;margin-top:6px}
.xt .tlink{margin-top:14px;color:#fff;border-color:var(--brass2)}
.mos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,17vw,250px);gap:14px}
.mos figure:nth-child(1){grid-column:span 2;grid-row:span 2;border-radius:var(--arch)}
.mos figure:nth-child(4){grid-row:span 2}
.near{list-style:none;padding:0;margin:28px 0 32px}
.near li{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.near li:first-child{border-top:1px solid var(--line)}
.near b{font:300 24px var(--f-d);color:var(--brassd);white-space:nowrap}
.near span:last-child{color:var(--mute);font-size:14px;text-align:right}
@media(max-width:1100px){.sctl .cbtn,.count{display:none}}
@media(max-width:1080px){.xgrid{grid-template-columns:1fr 1fr}.xt:nth-child(even){margin-top:0}.xt:nth-child(odd){margin-top:0}}
@media(max-width:960px){.intro{grid-template-columns:1fr}.pair figure:last-child{margin-bottom:0}.facts{grid-template-columns:1fr 1fr}

function sunT(d){const rad=Math.PI/180,lat=8.032,lon=98.823,tz=7;
  const N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),g=2*Math.PI/365*(N-1);
  const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const de=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(de))-Math.tan(lat*rad)*Math.tan(de))/rad;

let cur=0,timer=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const refill=bindStay($("#ci"),$("#co"),$("#gu"),()=>{});
function go(i){const s=document.querySelectorAll(".slide"),d=document.querySelectorAll("#dots button");cur=(i+s.length)%s.length;
  s.forEach((e,k)=>{e.classList.toggle("on",k===cur);e.setAttribute("aria-hidden",k!==cur)});d.forEach((e,k)=>e.setAttribute("aria-current",k===cur));
  $("#scount").textContent=`${String(cur+1).padStart(2,"0")} / ${String(s.length).padStart(2,"0")}`}
function auto(){clearInterval(timer);if(!reduce)timer=setInterval(()=>go(cur+1),7000)}
function render(){
  header("home",true);onLang(render);applyText();refill();
  const h=H[L],x=t(),set=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v};
  $("#slides").innerHTML=h.slides.map((s,i)=>`<div class="slide${i===cur?" on":""}" role="group" aria-roledescription="slide" aria-label="${i+1} / ${h.slides.length}"><img src="${U(s[0],2000)}" alt="" ${i?'loading="lazy"':'fetchpriority="high"'}><div class="cap"><div class="wrap"><p class="k">${s[1]}</p>${i?`<h2>${s[2]}</h2>`:`<h1>${s[2]}</h1>`}<div class="acts"><a class="btn gold" href="rooms.html">${h.bookA}</a><a class="btn line" href="#day">${h.storyA}</a></div></div></div></div>`).join("");
  $("#dots").innerHTML=h.slides.map((s,i)=>`<button aria-label="${i+1}"></button>`).join("");
  $("#dots").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{go(i);auto()});
  $("#sprev").innerHTML='<svg viewBox="0 0 24 24">'+ICON.l+'</svg>';$("#snext").innerHTML='<svg viewBox="0 0 24 24">'+ICON.r+'</svg>';
  go(cur);
  set("lci",x.ci);set("lco",x.co);set("lgu",x.gu);set("find",h.find);
  $("#bens").innerHTML=h.bens.map(b=>`<div class="ben"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[b[0]]}</svg><b>${b[1]}</b><span>${b[2]}</span></div>`).join("");
  ["inH","inP","rmH","rmP","rmAll","dayH","dayP","exH","exP","ofH","ofP","ofAll","gaH","ctH","ctP","ctA"].forEach(k=>set(k,h[k]));
  $("#inA").innerHTML=h.inA+arr();$("#gaA").innerHTML=h.gaA+arr();
  $("#facts").innerHTML=h.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("");
  $("#roomTrack").innerHTML=ROOMS.map(r=>`<a class="rcard" href="room.html?r=${r.id}"><figure><img loading="lazy" src="${U(r.gal[0][0],900)}" alt="${r.name}"></figure><div class="rm"><h3>${r.name}</h3><span class="pr">${x.from} <b>${baht(rate(r))}</b></span></div><p>${r.size} ${x.sqm} · ${r.vw[L]} · ${x.max(r.max)}</p></a>`).join("");
  $("#tl").innerHTML=h.stops.map(s=>`<article class="stop ${s[0]} rv"><figure><img loading="lazy" src="${U(s[4],1000)}" alt=""></figure><div><div class="time">${s[1]==="R"?RISE:s[1]==="S"?SET:s[1]}</div><h3>${s[2]}</h3><p>${s[3]}</p><p class="note">${s[5]}</p></div></article>`).join("");
  $("#xgrid").innerHTML=h.ex.map(e=>`<a class="xt rv" href="${e[0]}"><img loading="lazy" src="${U(e[1],800)}" alt=""><div><h3>${e[2]}</h3><p>${e[3]}</p><span class="tlink">${x.more}${arr()}</span></div></a>`).join("");
  $("#offTrack").innerHTML=OFFERS.map(offerCard).join("");
  $("#mos").innerHTML=MOS.map(m=>`<figure><img loading="lazy" src="${U(m,900)}" alt=""></figure>`).join("");
  $("#near").innerHTML=h.near.map(n=>`<li><b>${n[0]}</b><span>${n[1]}</span><span>${n[2]}</span></li>`).join("");
  document.querySelectorAll(".car").forEach(c=>{c.querySelector(".cbslot").innerHTML=cbtns();carousel(c)});
  reveal();
}
$("#sprev").onclick=()=>{go(cur-1);auto()};$("#snext").onclick=()=>{go(cur+1);auto()};
$("#hero").addEventListener("mouseenter",()=>clearInterval(timer));$("#hero").addEventListener("mouseleave",auto);
let sx=null;$("#hero").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});$("#hero").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){go(cur+(dx<0?1:-1));auto()}sx=null});
$("#bkf").onsubmit=e=>{e.preventDefault();location.href="rooms.html"};
window.__rerender=render;render();auto();
}
