<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuan Retreat Krabi</title>
<meta name="description" content="Nuan Retreat — a small 24-room retreat in Ao Nang, Krabi. Demo website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Trirong:wght@300;400;500&family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* Home: full-screen photo slider under a see-through header, a booking bar on its edge, then benefits,
   rooms and offers as sliding rows, the day-at-Nuan timeline, dining, spa, events and contact. */
.band{padding:clamp(64px,9vw,128px) 0}
.kick{font-size:14px;color:var(--soft);letter-spacing:.06em;margin-bottom:14px}
.body{color:#3b4747;font-size:17px;max-width:52ch}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.sh h2{font-size:clamp(32px,4vw,52px)}
/* slider */
.hero{position:relative;height:100svh;min-height:620px;max-height:1000px;background:var(--deep);color:#fff;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{position:absolute;inset:0;transform:scale(1.08);transition:transform 7s ease-out}
.slide.on img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,#0000 28%,#0000 45%,#000b 100%);pointer-events:none;z-index:1}
.cap{position:absolute;left:0;right:0;bottom:clamp(150px,20vh,210px);z-index:2}
.cap .k{font-size:14px;letter-spacing:.08em;opacity:.85;margin-bottom:12px}
.cap h1,.cap h2{font-size:clamp(44px,6.8vw,96px);max-width:14ch;line-height:1.02}
:lang(th) .cap h1,:lang(th) .cap h2{font-size:clamp(38px,5.6vw,80px);line-height:1.2;max-width:16ch}
.cap .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;justify-content:flex-start}
.btn.ghost{background:transparent;color:#fff;border-color:#ffffffa0}.btn.ghost:hover{background:#ffffff1f}
.sctl{position:absolute;z-index:3;right:max(5vw,20px);bottom:clamp(150px,20vh,210px);display:flex;align-items:center;gap:14px}
.sctl .cbtn{background:transparent;border-color:#ffffffa0;color:#fff}.sctl .cbtn:hover{background:#fff;color:var(--ink)}
.dots{display:flex;gap:8px}
.dots button{width:34px;height:44px;border:0;background:none;cursor:pointer;padding:0;position:relative}
.dots button::before{content:"";position:absolute;left:0;right:0;top:21px;height:2px;background:#ffffff66}
.dots button[aria-current=true]::before{background:#fff}
.count{font:400 15px Gloock,serif;min-width:44px;text-align:right}
/* booking bar */
.bkb{position:absolute;z-index:4;left:0;right:0;bottom:28px}
.bkf{background:#fff;color:var(--ink);border-radius:999px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:center;padding:8px 8px 8px 32px;box-shadow:0 20px 50px #0003}
.bkf .field{padding:6px 18px 6px 0}.bkf .field+.field{padding-left:18px;border-left:1px solid var(--line)}
/* benefits */
.benband{background:var(--stone);padding:clamp(40px,5vw,64px) 0}
.benband h2{text-align:center;font-size:clamp(26px,3vw,36px);margin-bottom:28px}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center}
.pair{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:end}
.pair figure:first-child{aspect-ratio:3/4;border-radius:var(--arch)}.pair figure:last-child{aspect-ratio:3/4;border-radius:22px;margin-bottom:56px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 30px;margin-top:32px}
.facts div{border-top:1px solid var(--line);padding-top:12px}
.facts b{display:block;font:400 38px/1 Gloock,serif}.facts span{font-size:14px;color:var(--soft)}
/* room cards in the carousel */
.rcard{text-decoration:none;display:block}
.rcard figure{aspect-ratio:3/3.7;border-radius:var(--arch)}
.rcard img{transition:transform .8s ease}.rcard:hover img{transform:scale(1.04)}
.rcard h3{margin-top:18px}
.rcard p{color:var(--soft);font-size:15px;margin-top:4px}
.rcard .pr{margin-top:8px;font-size:15px}.rcard .pr b{font:400 24px Gloock,serif}
/* day */
.day{background:var(--stone)}
.dayh{text-align:center;max-width:720px;margin:0 auto 56px}
.dayh .body{margin:16px auto 0;text-align:center}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#d6cec1}
.stop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,110px);align-items:center;padding:24px 0;position:relative}
.stop::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:var(--stone);border:2px solid var(--deep);transform:translate(-50%,-50%)}
.stop.sun::after{border-color:var(--sun);background:var(--sun)}
.stop figure{aspect-ratio:4/3.3;border-radius:26px}
.stop:nth-child(odd) figure{border-radius:var(--arch);aspect-ratio:4/4.4}
.stop:nth-child(even) figure{order:2}
.time{font:400 42px/1 Gloock,serif;color:var(--deep);margin-bottom:10px;white-space:nowrap}
.stop.sun .time{color:var(--sun)}
.stop p{color:#3b4747;margin-top:8px;max-width:44ch}
.stop .note{font-size:14px;color:var(--soft);margin-top:10px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}
/* feature sections */
.feat{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,88px);align-items:center}
.feat.flip figure:first-child,.feat.flip .fpics{order:2}
.fpics{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:end}
.fpics figure:first-child{aspect-ratio:4/4.4;border-radius:var(--arch)}
.fpics figure+figure{aspect-ratio:3/4;border-radius:20px}
.feat .one{aspect-ratio:4/3.2;border-radius:var(--arch)}
.list2{list-style:none;padding:0;margin:22px 0 26px}
.list2 li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.list2 li:first-child{border-top:1px solid var(--line)}
.list2 li span:last-child{color:var(--soft);white-space:nowrap}
.dark{background:var(--deep);color:#e8efee}
.dark .kick,.dark .list2 li span:last-child{color:#9fb3b1}
.dark .body{color:#b9c6c4}
.dark .list2 li{border-color:#ffffff24}
.dark .btn.line{color:#fff;border-color:#ffffffa0}.dark .btn.line:hover{background:#ffffff1a}
/* contact */
.ct{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,96px);align-items:start}
.near{list-style:none;padding:0;margin:0}
.near li{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line)}
.near li:first-child{border-top:1px solid var(--line)}
.near b{font:400 22px Gloock,serif;color:var(--deep);white-space:nowrap;min-width:72px}
.near span:last-child{color:var(--soft);font-size:14.5px;text-align:right}
.cbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.cbox div{background:var(--stone);border-radius:16px;padding:14px 16px}.cbox span{display:block;font-size:13px;color:var(--soft)}.cbox b{font-weight:500;overflow-wrap:anywhere}
.lineb{background:#06c755;border-color:#06c755}.lineb:hover{background:#05a948}
footer{margin-top:0}
@media(max-width:960px){.intro,.feat,.ct{grid-template-columns:1fr}.feat.flip .fpics,.feat.flip figure:first-child{order:0}.pair figure:last-child{margin-bottom:0}.bkf{grid-template-columns:1fr 1fr 1fr}.bkf .btn{grid-column:1/-1;margin-top:6px}.bkf{border-radius:26px;padding:12px 16px}}
@media(max-width:720px){.cap{bottom:auto;top:calc(var(--annh,40px) + 110px)}.sctl{bottom:auto;top:calc(var(--annh,40px) + 64px);right:auto;left:max(5vw,20px)}.sctl .cbtn,.count{display:none}
.bkb{bottom:16px}.bkf{grid-template-columns:1fr 1fr}.bkf .field:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line)}
.tl::before{left:7px}.stop{grid-template-columns:1fr;gap:16px;padding:22px 0 22px 30px}.stop::after{left:7px;top:32px}.stop:nth-child(even) figure{order:0}.stop:nth-child(odd) figure{aspect-ratio:4/3.6}.time{font-size:34px}
.facts b{font-size:32px}.near li{grid-template-columns:auto 1fr}.near span:last-child{grid-column:2;text-align:left;margin-top:-10px}.cbox{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.slide,.slide img{transition:none}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>

let cur=0,timer=null,io=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const refill=bindStay($("#ci"),$("#co"),$("#gu"),()=>{});
function go(i){const s=document.querySelectorAll(".slide"),d=document.querySelectorAll("#dots button");cur=(i+s.length)%s.length;
  s.forEach((e,k)=>{e.classList.toggle("on",k===cur);e.setAttribute("aria-hidden",k!==cur)});d.forEach((e,k)=>e.setAttribute("aria-current",k===cur));
  $("#scount").textContent=`${String(cur+1).padStart(2,"0")} / ${String(s.length).padStart(2,"0")}`}
function auto(){clearInterval(timer);if(!reduce)timer=setInterval(()=>go(cur+1),6500)}
function render(){
  header("home",true);onLang(render);applyText();refill();
  const h=H[L],x=t(),set=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v};
  $("#slides").innerHTML=h.slides.map((s,i)=>`<div class="slide${i===cur?" on":""}" role="group" aria-roledescription="slide" aria-label="${i+1} / ${h.slides.length}"><img src="${U(s[0],2000)}" alt="" ${i?'loading="lazy"':'fetchpriority="high"'}><div class="cap"><div class="wrap"><p class="k">${s[1]}</p>${i?`<h2>${s[2]}</h2>`:`<h1>${s[2]}</h1>`}<div class="acts"><a class="btn bookbtn" href="rooms.html">${h.bookA}</a><a class="btn ghost" href="#day">${h.storyA}</a></div></div></div></div>`).join("");
  $("#dots").innerHTML=h.slides.map((s,i)=>`<button aria-label="${i+1}"></button>`).join("");
  $("#dots").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{go(i);auto()});
  $("#sprev").innerHTML='<svg viewBox="0 0 24 24">'+ICON.l+'</svg>';$("#snext").innerHTML='<svg viewBox="0 0 24 24">'+ICON.r+'</svg>';
  go(cur);
  set("lci",x.ci);set("lco",x.co);set("lgu",x.gu);set("find",h.find);set("benH",h.benH);
  $("#bens").innerHTML=h.bens.map(b=>`<div class="ben"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[b[0]]}</svg><b>${b[1]}</b><span>${b[2]}</span></div>`).join("");
  ["inK","inH","inP","rmK","rmH","rmAll","dayK","dayH","dayP","ofK","ofH","ofAll","dnK","dnH","dnP","dnB","spK","spH","spP","spB","evK","evH","evP","evB","ctK","ctH","ctP","ctB","ctR"].forEach(k=>set(k,h[k]));
  $("#facts").innerHTML=h.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("");
  $("#roomTrack").innerHTML=ROOMS.map(r=>`<a class="rcard" href="room.html?r=${r.id}"><figure><img loading="lazy" src="${U(r.gal[0][0],800)}" alt="${r.name}"></figure><h3>${r.name}</h3><p>${r.size} ${x.sqm} · ${r.vw[L]} · ${x.max(r.max)}</p><p class="pr">${x.from} <b>${baht(rate(r))}</b> ${x.night}</p></a>`).join("");
  $("#tl").innerHTML=h.stops.map(s=>`<article class="stop ${s[0]} reveal"><figure><img loading="lazy" src="${U(s[4],1000)}" alt=""></figure><div><div class="time">${s[1]==="R"?RISE:s[1]==="S"?SET:s[1]}</div><h3>${s[2]}</h3><p>${s[3]}</p><p class="note">${s[5]}</p></div></article>`).join("");
  $("#offTrack").innerHTML=OFFERS.map(offerCard).join("");
  const li=a=>a.map(r=>`<li><span>${r[0]}</span><span>${r[1]}</span></li>`).join("");
  $("#dnL").innerHTML=li(h.dnL);$("#spL").innerHTML=li(h.spL);$("#evL").innerHTML=li(h.evL);
  $("#cbox").innerHTML=h.cbox.map(c=>`<div><span>${c[0]}</span><b>${c[1]}</b></div>`).join("");
  $("#near").innerHTML=h.near.map(n=>`<li><b>${n[0]}</b><span>${n[1]}</span><span>${n[2]}</span></li>`).join("");
  document.querySelectorAll(".car").forEach(c=>{c.querySelector(".cbslot").innerHTML=cbtns();carousel(c)});
  if(io)io.disconnect();
  if("IntersectionObserver" in window){io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(el=>io.observe(el))}
  else document.querySelectorAll(".reveal").forEach(el=>el.classList.add("in"));
}
$("#sprev").onclick=()=>{go(cur-1);auto()};$("#snext").onclick=()=>{go(cur+1);auto()};
$("#hero").addEventListener("mouseenter",()=>clearInterval(timer));$("#hero").addEventListener("mouseleave",auto);
let sx=null;$("#hero").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});$("#hero").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){go(cur+(dx<0?1:-1));auto()}sx=null});
$("#bkf").onsubmit=e=>{e.preventDefault();location.href="rooms.html"};
window.__rerender=render;render();auto();
}
