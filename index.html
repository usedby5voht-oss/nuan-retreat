<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuan Retreat Krabi</title>
<meta name="description" content="Nuan Retreat — a small 24-room retreat in Ao Nang, Krabi. Demo website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Trirong:wght@300;400;500&family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a storyteller walking a guest through one day at the resort, calm and specific.
   IDEA: the limestone sea-caves of Railay; each photograph is seen through an arch, and the page is one day told hour by hour.
   PICTURE: a tall arched pool photograph opens the day; a timeline from today's real sunrise to after dark carries the story.
   COLOUR and TYPE: white, limestone #f1ede6, deep Andaman #0e2f33, sunset #d8642f for times and the main action; Gloock, Trirong, Anuphan.
   LAYOUT: hero, place, the house, a day timeline alternating left/right, rooms teaser, getting here, closing call to the rooms page. */
:root{color-scheme:light;--bg:#fff;--stone:#f1ede6;--ink:#152224;--soft:#66706f;--deep:#0e2f33;--sun:#d8642f;--line:#e2ddd4;--arch:1000px 1000px 0 0}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16.5px/1.8 Anuphan,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Gloock,Trirong,serif;font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
:lang(th) h1,:lang(th) h2,:lang(th) h3{font-family:Trirong,Gloock,serif;line-height:1.35}
h2{font-size:clamp(32px,4.2vw,54px)}h3{font-size:clamp(24px,2.4vw,30px)}
p{margin:0}a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--stone)}
figure{margin:0;overflow:hidden;position:relative}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,20px)}
.band{padding:clamp(72px,10vw,140px) 0}
.arch{border-radius:var(--arch)}
.kick{font-size:14px;color:var(--soft);letter-spacing:.06em;margin-bottom:16px}
.body{color:#3b4747;font-size:17px;max-width:52ch}
.demo{background:var(--deep);color:#c9d6d4;font-size:12.5px;text-align:center;padding:6px 14px}
nav{position:sticky;top:0;z-index:40;background:#ffffffeb;backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.sc{border-color:var(--line)}
.nv{display:flex;align-items:center;gap:30px;height:74px}
.brand{text-decoration:none;display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:30px;height:34px}
.brand b{font:400 25px/1 Gloock,serif;letter-spacing:.08em}
.brand small{display:block;font:400 10.5px Anuphan;letter-spacing:.24em;color:var(--soft);margin-top:5px}
.tabsnav{display:flex;background:var(--stone);border-radius:999px;padding:4px;gap:2px}
.tabsnav a{text-decoration:none;font-size:15px;color:#3b4747;padding:0 22px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:999px;white-space:nowrap}
.tabsnav a:hover{color:var(--ink)}
.tabsnav a[aria-current]{background:var(--deep);color:#fff}
.lang{display:flex}.lang button{background:none;border:0;color:var(--soft);min-width:38px;min-height:42px;font:500 13px Anuphan;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:#fff;font:400 15px Anuphan;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:#082024}
.btn.line{background:transparent;color:var(--ink)}.btn.line:hover{background:var(--stone)}
.btn.sun{background:var(--sun);border-color:var(--sun)}.btn.sun:hover{background:#bf5323}
.btn.ghost{background:transparent;color:#fff;border-color:#ffffff88}.btn.ghost:hover{background:#ffffff1a}
a:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
/* hero */
.hero{padding:clamp(28px,4vw,56px) 0 clamp(56px,7vw,96px)}
.hg{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center}
.hero h1{font-size:clamp(52px,7.4vw,108px)}
:lang(th) .hero h1{font-size:clamp(46px,6.4vw,92px);line-height:1.2}
.hero .body{margin-top:24px;font-size:18.5px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hero .arch{aspect-ratio:4/5.3;box-shadow:0 40px 80px -40px #0e2f3366}
.hero .arch img{animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:scale(1.12)}}
.today{display:flex;gap:28px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.today b{display:block;font:400 30px/1.1 Gloock,serif}.today .s b{color:var(--sun)}
.today span{font-size:13px;color:var(--soft)}
/* place */
.place{background:var(--deep);color:#e8efee;overflow:hidden}
.place .body{color:#b5c6c4}
.pg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:center}
.mosaic{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto;gap:16px}
.mosaic figure:first-child{grid-row:1/3;aspect-ratio:3/4.4}
.mosaic figure:nth-child(2){aspect-ratio:1;border-radius:22px}
.mosaic figure:nth-child(3){aspect-ratio:1;border-radius:22px}
.cap{position:absolute;left:12px;bottom:12px;background:#0e2f33cc;color:#fff;font-size:12.5px;border-radius:999px;padding:3px 12px;white-space:nowrap}
.season{display:flex;gap:32px;flex-wrap:wrap;margin-top:34px;padding-top:22px;border-top:1px solid #ffffff2a}
.season b{display:block;font:400 26px/1.2 Gloock,serif;color:#fff}:lang(th) .season b{font-family:Trirong,serif}
.season span{font-size:13.5px;color:#9fb3b1}
/* house */
.hs{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:end}
.pair{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:end}
.pair figure:first-child{aspect-ratio:3/4}.pair figure:last-child{aspect-ratio:3/4;border-radius:22px;margin-bottom:60px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 32px;margin-top:36px}
.facts div{border-top:1px solid var(--line);padding-top:14px}
.facts b{display:block;font:400 40px/1 Gloock,serif}
.facts span{font-size:14px;color:var(--soft)}
/* day */
.day{background:var(--stone)}
.dayh{text-align:center;max-width:720px;margin:0 auto 64px}
.dayh .body{margin:18px auto 0;text-align:center}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#d6cec1}
.stop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,110px);align-items:center;padding:28px 0;position:relative}
.stop::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:var(--stone);border:2px solid var(--deep);transform:translate(-50%,-50%)}
.stop.sunrise::after,.stop.sunset::after{border-color:var(--sun);background:var(--sun)}
.stop figure{aspect-ratio:4/3.4;border-radius:26px}
.stop:nth-child(odd) figure{border-radius:var(--arch);aspect-ratio:4/4.6}
.stop:nth-child(even) figure{order:2}
.time{font:400 44px/1 Gloock,serif;color:var(--deep);margin-bottom:12px;white-space:nowrap}
.sunrise .time,.sunset .time{color:var(--sun)}
.stop p{color:#3b4747;margin-top:10px;max-width:44ch}
.stop .note{font-size:14px;color:var(--soft);margin-top:12px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}
/* rooms teaser */
.rhead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
.rhead .body{color:var(--soft)}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.room{text-decoration:none;display:block}
.room figure{aspect-ratio:3/4;border-radius:var(--arch)}
.room img{transition:transform .8s ease}.room:hover img{transform:scale(1.04)}
.room h3{margin-top:20px}
.room p{color:var(--soft);font-size:15px;margin-top:4px}
.room .from{margin-top:10px;font-size:15px}.room .from b{font:400 24px Gloock,serif}
/* getting here */
.gh{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,96px);align-items:start}
.near{list-style:none;padding:0;margin:0}
.near li{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.near li:first-child{border-top:1px solid var(--line)}
.near b{font:400 22px Gloock,serif;color:var(--deep);white-space:nowrap;min-width:72px}
.near span:last-child{color:var(--soft);font-size:14.5px;text-align:right}
/* cta */
.cta{position:relative;color:#fff;background:var(--deep);overflow:hidden}
.cta img{position:absolute;inset:0;opacity:.45}
.cta .wrap{position:relative;text-align:center;padding-top:clamp(90px,12vw,170px);padding-bottom:clamp(90px,12vw,170px)}
.cta h2{font-size:clamp(36px,5vw,64px);max-width:16ch;margin:0 auto}
.cta p{color:#dfe8e7;margin:18px auto 0;max-width:46ch}
.cta .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
footer{background:var(--deep);color:#a9bcba;font-size:14px;padding:48px 0 34px;border-top:1px solid #ffffff1a}
.ft{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end}
.ft .brand b{color:#fff}
.credit{margin-top:28px;padding-top:16px;border-top:1px solid #ffffff22;font-size:12.5px}
@media(max-width:960px){.rooms{grid-template-columns:1fr 1fr}.pg,.hs,.gh{grid-template-columns:1fr}.pair figure:last-child{margin-bottom:0}}
@media(max-width:720px){.nv{flex-wrap:wrap;height:auto;gap:8px 16px;padding:10px 0 12px}.nv>.btn{display:none}.tabsnav{order:3;width:100%}.tabsnav a{flex:1}.brand b{font-size:21px}.hg{grid-template-columns:1fr}.hero .arch{aspect-ratio:4/4.4}
.tl::before{left:7px}.stop{grid-template-columns:1fr;gap:18px;padding:24px 0 24px 30px}.stop::after{left:7px;top:34px}.stop:nth-child(even) figure{order:0}.stop:nth-child(odd) figure{aspect-ratio:4/3.6}.time{font-size:36px}
.rooms{grid-template-columns:1fr}.room figure{aspect-ratio:4/4.3}.mosaic figure:first-child{aspect-ratio:3/4.6}.facts b{font-size:34px}.near li{grid-template-columns:auto 1fr}.near span:last-child{grid-column:2;text-align:left;margin-top:-10px}}
@media(prefers-reduced-motion:reduce){.hero .arch img{animation:none}.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

  <a class="brand" href="index.html" aria-label="Nuan Retreat"><svg viewBox="0 0 30 34" aria-hidden="true"><path d="M2 34V15a13 13 0 0 1 26 0v19" fill="none" stroke="#0e2f33" stroke-width="2.2"/><path d="M9 34V17a6 6 0 0 1 12 0v17" fill="none" stroke="#d8642f" stroke-width="2.2"/></svg><span><b>NUAN</b><small>RETREAT · KRABI</small></span></a>
  <div class="tabsnav"><a href="index.html" aria-current="page" data-t="navHome"></a><a href="rooms.html" data-t="navRooms"></a></div>

    <figure><img loading="lazy" src="https://images.unsplash.com/photo-1650201777491-c5baae006026?auto=format&fit=crop&w=700&q=80" alt="Breakfast table with fresh juice"></figure>

<script>
{
const U=(id,w)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;
/* Sunrise/sunset for Ao Nang (8.03N, 98.82E, UTC+7), NOAA approximation */
function sun(d){const rad=Math.PI/180,lat=8.032,lon=98.823,tz=7;
  const N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),g=2*Math.PI/365*(N-1);
  const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const de=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(de))-Math.tan(lat*rad)*Math.tan(de))/rad;
  const t=m=>{m=Math.round(((m%1440)+1440)%1440);return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`};
  return [t(720-4*(lon+ha)-eq+tz*60),t(720-4*(lon-ha)-eq+tz*60)]}
const [RISE,SET]=sun(new Date());

const T={
th:{demo:"เว็บไซต์ตัวอย่าง: รีสอร์ตสมมติเพื่อสาธิตงานออกแบบ ไม่มีการจองหรือตัดเงินจริง",navHome:"หน้าแรก",navStory:"เรื่องราว",navDay:"หนึ่งวันที่นวล",navRooms:"ห้องพัก",navHere:"การเดินทาง",navBook:"ดูห้องและจอง",
heroKick:"อ่าวนาง · กระบี่",heroH:"หนึ่งวันที่นวล",
heroP:"ตื่นมาพร้อมแสงแรกเหนือผาหินปูน นั่งเรือหางยาวไปไร่เลย์ บ่ายนอนเล่นริมสระ แล้วกลับมาดูพระอาทิตย์ตกจากดาดฟ้า นี่คือวันธรรมดาของแขกที่มาพักกับเรา",
heroA:"เลื่อนดูทั้งวัน",heroB:"ดูห้องพัก",rise:"พระอาทิตย์ขึ้นวันนี้",set:"พระอาทิตย์ตกวันนี้",
placeKick:"สถานที่",placeH:"ที่ที่ผาหินปูนพบทะเลอันดามัน",
placeP:"อ่าวนางรายล้อมด้วยผาหินปูนสูงชันและเกาะเล็กเกาะน้อยกลางทะเล จากหน้าหาดมีเรือหางยาวไปไร่เลย์ เกาะปอดะ และทะเลแหวกตลอดวัน ตกเย็นถนนเลียบหาดเต็มไปด้วยร้านอาหารทะเลและแสงไฟ",
cap1:"ผาหินที่ไร่เลย์",cap2:"เกาะหน้าอ่าวนาง",cap3:"หาดอ่าวนางยามเย็น",
season:[["พ.ย. – เม.ย.","ฤดูท่องเที่ยว ทะเลเรียบ ฟ้าใส"],["พ.ค. – ต.ค.","หน้าฝน เขียวชอุ่ม ห้องว่างมากกว่า"]],
houseKick:"ที่พัก",houseH:"บ้านหลังเล็ก ห้องพักเพียง 24 ห้อง",
houseP:"นวลตั้งอยู่ในซอยเงียบหลังถนนเลียบหาด ตัวอาคารเป็นปูนสีดินเผา ทางเดินร่มรื่นด้วยต้นไม้ และมีสระว่ายน้ำกลางสวน เราตั้งใจให้มีห้องพักไม่มาก ทุกคนจึงได้ใช้สระ สวน และดาดฟ้าได้อย่างไม่ต้องรอคิว",
facts:[["24","ห้องพักทั้งหมด"],["6 นาที","เดินถึงหาดอ่าวนาง"],["1","สระว่ายน้ำกลางสวน"],["30 นาที","จากสนามบินกระบี่"]],

let L="th";try{L=localStorage.getItem("nuan-lang")||"th"}catch(e){}
const $=s=>document.querySelector(s);
const baht=n=>(L==="th"?"฿":"THB ")+n.toLocaleString("en-US");
let io;
function render(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  $("#today").innerHTML=`<div><b>${RISE}</b><span>${t.rise}</span></div><div class="s"><b>${SET}</b><span>${t.set}</span></div>`;
  $("#season").innerHTML=t.season.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
  $("#facts").innerHTML=t.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("");
  $("#tl").innerHTML=t.stops.map(s=>`<article class="stop ${s[0]} reveal"><figure><img loading="lazy" src="${U(s[4],1000)}" alt="${s[2]}"></figure><div><div class="time">${s[1]==="RISE"?RISE:s[1]==="SET"?SET:s[1]}</div><h3>${s[2]}</h3><p>${s[3]}</p><p class="note">${s[5]}</p></div></article>`).join("");
  $("#roomList").innerHTML=rooms.map(r=>`<a class="room" href="room.html?r=${r[0]}"><figure><img loading="lazy" src="${U(r[2],900)}" alt="${r[1]}"></figure><h3>${r[1]}</h3><p>${r[4][L]}</p><p class="from">${t.from} <b>${baht(r[3])}</b> ${t.perN}</p></a>`).join("");
  $("#near").innerHTML=t.near.map(n=>`<li><b>${n[0]}</b><span>${n[1]}</span><span>${n[2]}</span></li>`).join("");
  if(io)io.disconnect();
  if("IntersectionObserver" in window){io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});document.querySelectorAll(".reveal").forEach(el=>io.observe(el))}
  else document.querySelectorAll(".reveal").forEach(el=>el.classList.add("in"));
}
const nav=$("#nav");addEventListener("scroll",()=>nav.classList.toggle("sc",scrollY>10),{passive:true});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("nuan-lang",L)}catch(e){}render()});
render();
}
