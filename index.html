<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuan Retreat Krabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Trirong:wght@300;400;500&family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, confident, a little poetic — a small resort that knows its place.
   IDEA: the limestone sea-caves of Railay — every photograph is seen through an arch, as if from inside a cave.
   PICTURE: a tall arch-framed pool photograph beside the headline, with today's sunrise and sunset for Ao Nang beneath.
   COLOUR and TYPE: white and pale limestone #f1ede6, deep Andaman #0e2f33, sunset #d8642f used only for the sun line and the pay button; Gloock display, Trirong for Thai headings, Anuphan for text.
   LAYOUT: asymmetric two-column hero, a row of three arched room portals, then perks, experiences, destination, footer. */
:root{color-scheme:light;--bg:#fff;--stone:#f1ede6;--ink:#152224;--soft:#66706f;--deep:#0e2f33;--sun:#d8642f;--line:#e2ddd4;--arch:1000px 1000px 0 0}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16.5px/1.75 Anuphan,"IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Gloock,Trirong,serif;font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.005em}
:lang(th) h1,:lang(th) h2,:lang(th) h3{font-family:Trirong,Gloock,serif;font-weight:400;line-height:1.35;letter-spacing:0}
h2{font-size:clamp(32px,4vw,52px)}h3{font-size:24px}
p{margin:0}a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--stone)}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,20px)}
.band{padding:clamp(72px,10vw,136px) 0}
.small{font-size:13.5px;color:var(--soft)}
.arch{border-radius:var(--arch);overflow:hidden;margin:0;position:relative}
.demo{background:var(--deep);color:#c9d6d4;font-size:12.5px;text-align:center;padding:6px 14px}
/* nav */
nav{position:sticky;top:0;z-index:40;background:#ffffffeb;backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.sc{border-color:var(--line)}
.nv{display:flex;align-items:center;gap:30px;height:74px}
.brand{text-decoration:none;display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:30px;height:34px}
.brand b{font:400 25px/1 Gloock,serif;letter-spacing:.08em}
.brand small{display:block;font:400 10.5px Anuphan;letter-spacing:.24em;color:var(--soft);margin-top:5px}
.links{display:flex;gap:28px}.links a{text-decoration:none;font-size:15px;color:#3b4747}.links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.lang{display:flex}.lang button{background:none;border:0;color:var(--soft);min-width:38px;min-height:42px;font:500 13px Anuphan;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:#fff;font:400 15px Anuphan;cursor:pointer;text-decoration:none;transition:background .2s,transform .2s}
.btn:hover{background:#082024}
.btn.line{background:transparent;color:var(--ink)}.btn.line:hover{background:var(--stone)}
.btn.sun{background:var(--sun);border-color:var(--sun)}.btn.sun:hover{background:#bf5323}
.btn[disabled]{opacity:.35;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
/* hero */
.hero{padding:clamp(28px,4vw,56px) 0 0}
.hg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,96px);align-items:end}
.hero .arch{aspect-ratio:4/5.2;box-shadow:0 40px 80px -40px #0e2f3366}
.hero .arch img{animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:scale(1.12)}}
.place{font-size:14px;color:var(--soft);letter-spacing:.06em;margin-bottom:18px}
.hero h1{font-size:clamp(46px,6.4vw,92px)}
:lang(th) .hero h1{font-size:clamp(38px,5vw,70px);line-height:1.25}
.hero .lead{margin-top:22px;font-size:18px;color:#3b4747;max-width:40ch}
.sky{display:flex;gap:0;margin-top:40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sky div{flex:1;padding:16px 18px 16px 0}
.sky div+div{padding-left:18px;border-left:1px solid var(--line)}
.sky b{display:block;font:400 30px/1.1 Gloock,serif;white-space:nowrap}
.sky .s b{color:var(--sun)}
.sky span{font-size:13px;color:var(--soft)}
/* booking */
.book{margin-top:clamp(36px,5vw,64px);background:var(--stone);border-radius:999px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:center;padding:8px 8px 8px 34px}
.book>div{padding:8px 18px 8px 0}
.book>div+div{padding-left:18px;border-left:1px solid #d9d2c6}
.book label{display:block;font-size:12.5px;color:var(--soft)}
.book input,.book select{width:100%;border:0;background:transparent;font:400 16px Anuphan;color:var(--ink);padding:2px 0;min-height:32px}
/* rooms */
.rhead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:52px}
.rhead p{color:var(--soft);max-width:46ch}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.room .arch{aspect-ratio:3/4}
.room .arch img{transition:transform .8s ease}
.room:hover .arch img{transform:scale(1.04)}
.room h3{margin-top:22px}
.room .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin:6px 0 10px}
.room .desc{color:#3b4747;font-size:15.5px}
.rp{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.rp b{font:400 30px/1 Gloock,serif;white-space:nowrap}.rp s{color:var(--soft);font-size:14px;white-space:nowrap}
.status{font-size:13.5px;color:#9a5a1c;min-height:22px;margin:4px 0 14px}.status.no{color:#a33a2b}
.tag{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fffffff0;border-radius:999px;padding:4px 14px;font-size:13px;white-space:nowrap}
/* perks */
.perks{background:var(--deep);color:#e8efee;position:relative;overflow:hidden}
.perks .ghost{position:absolute;right:-6vw;top:-10%;width:42vw;max-width:560px;height:120%;border:1px solid #ffffff1c;border-radius:var(--arch)}
.perks .ghost+.ghost{right:2vw;width:30vw;max-width:400px;top:15%}
.pk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px;margin-top:52px;position:relative}
.pk div{border-top:1px solid #ffffff33;padding-top:22px}
.pk h3{font-size:22px;color:#fff}
.pk p{color:#a9bcba;margin-top:8px;font-size:15px}
.save{margin-top:56px;display:flex;gap:44px;flex-wrap:wrap;align-items:baseline;position:relative}
.save div{font-size:14px;color:#a9bcba}.save b{display:block;font:400 34px/1.15 Gloock,serif;color:#fff}
.save .us b{color:#f3a77f}
/* experiences */
.exg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);margin-top:52px;align-items:start}
.ex:nth-child(2){margin-top:70px}
.ex figure{aspect-ratio:1/1.15;border-radius:24px;overflow:hidden;margin:0 0 18px}
.ex p{color:var(--soft);font-size:15px;margin-top:6px}
.ex .t{font-size:13.5px;color:var(--sun);margin-top:10px}
/* destination */
.dest{background:var(--stone)}
.dgrid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center}
.dpics{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:end}
.dpics .arch:first-child{aspect-ratio:3/4.3}
.dpics .stack{display:grid;gap:16px}.dpics .stack figure{aspect-ratio:1;border-radius:20px;overflow:hidden;margin:0}
.near{list-style:none;padding:0;margin:30px 0}
.near li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #d9d2c6;font-size:15.5px}
.near li span:last-child{white-space:nowrap;color:var(--soft)}
.lineb{background:#06c755;border-color:#06c755}.lineb:hover{background:#05a948}
footer{background:var(--deep);color:#a9bcba;font-size:14px;padding:56px 0 36px}
.ft{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end}
.ft .brand b{color:#fff}
.credit{margin-top:34px;padding-top:18px;border-top:1px solid #ffffff22;font-size:12.5px}
/* checkout */
dialog{border:0;padding:0;width:min(560px,96vw);max-height:94vh;background:#fff;color:var(--ink);border-radius:28px;box-shadow:0 40px 90px #0007}
dialog::backdrop{background:#0e2f33d9}
.dl{padding:30px 32px 32px}
.steps{display:flex;gap:8px;margin-bottom:20px;font-size:13px;color:var(--soft)}
.steps span{display:flex;align-items:center;gap:6px}
.steps i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.steps .on{color:var(--ink)}.steps .on i{background:var(--deep);border-color:var(--deep);color:#fff}
.steps .done i{background:var(--stone)}
.steps em{flex:1;height:1px;background:var(--line);align-self:center;min-width:12px}
.dl h3{font-size:28px}
.sum{margin:16px 0;font-size:15px;background:var(--stone);border-radius:18px;padding:6px 18px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ddd6ca}
.sum div:last-child{border:0}
.sum span:last-child{white-space:nowrap;text-align:right}
.sum .tot{font-weight:500;font-size:17px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f2 .full{grid-column:1/-1}
.f2 label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.f2 input{width:100%;border:1px solid #d6d1c8;border-radius:12px;font:400 16px Anuphan;padding:0 14px;min-height:48px;background:#fff;color:var(--ink)}
.f2 input.bad{border-color:#a33a2b}
.err{color:#a33a2b;font-size:14px;min-height:22px;margin-top:8px}
.acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--stone);border-radius:999px;padding:4px;margin:16px 0 18px}
.tabs button{border:0;background:transparent;border-radius:999px;min-height:42px;font:400 15px Anuphan;color:var(--soft);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}
.card{position:relative;aspect-ratio:1.6;max-width:300px;margin:0 auto 18px;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#0e2f33,#1d5a5f 60%,#d8642f);display:flex;flex-direction:column;justify-content:space-between;font-size:13px;overflow:hidden}
.card::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:200px;border:1px solid #ffffff33;border-radius:var(--arch)}
.card .no{font:400 19px/1 Gloock,serif;letter-spacing:.12em;white-space:nowrap}
.card .row{display:flex;justify-content:space-between;gap:8px;text-transform:uppercase}
.testnote{font-size:13px;background:#fff6e8;border:1px solid #f0dcb8;border-radius:12px;padding:10px 12px;margin-bottom:14px;color:#6b4a14}
.qr{display:grid;justify-items:center;gap:8px;text-align:center}
.qr .box{width:220px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff}
.qr .pp{background:#113566;color:#fff;border-radius:8px;padding:4px 10px;font:500 13px Anuphan;margin-bottom:10px}
.qr .amt{font:400 28px Gloock,serif}
.qr .timer{font-size:13.5px;color:var(--soft)}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--stone);border-top-color:var(--deep);margin:22px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{text-align:center}
.ok .arch{width:96px;height:110px;margin:6px auto 16px;background:var(--deep);display:grid;place-items:center}
.ref{font:400 30px Gloock,serif;letter-spacing:.1em;margin:8px 0 12px}
@media(max-width:960px){.links{display:none}.rooms{grid-template-columns:1fr 1fr}.pk{grid-template-columns:1fr 1fr}.exg{grid-template-columns:1fr 1fr}.ex:nth-child(2){margin-top:0}.dgrid{grid-template-columns:1fr}}
@media(max-width:720px){.nv>.btn{display:none}.hg{grid-template-columns:1fr}.hero .arch{aspect-ratio:4/4.6;order:2}.book{border-radius:26px;grid-template-columns:1fr 1fr;padding:14px 16px 16px}.book>div{padding:8px 10px 8px 0}.book>div+div{padding-left:10px}.book>div:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid #d9d2c6}.book .btn{grid-column:1/-1;margin-top:6px}
.rooms,.pk,.exg{grid-template-columns:1fr}.room .arch{aspect-ratio:4/4.4}.f2{grid-template-columns:1fr}.dl{padding:22px 20px 24px}.brand b{font-size:21px}.sky{flex-wrap:wrap}.sky div{flex:1 1 40%}.sky div:nth-child(3){flex-basis:100%;border-left:0;padding-left:0;border-top:1px solid var(--line)}.sky b{font-size:25px}.steps b{display:none}}
@media(prefers-reduced-motion:reduce){.hero .arch img,.spin{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="demo" data-t="demo"></div>
<nav id="nav"><div class="wrap nv">
  <a class="brand" href="#top" aria-label="Nuan Retreat"><svg viewBox="0 0 30 34" aria-hidden="true"><path d="M2 34V15a13 13 0 0 1 26 0v19" fill="none" stroke="#0e2f33" stroke-width="2.2"/><path d="M9 34V17a6 6 0 0 1 12 0v17" fill="none" stroke="#d8642f" stroke-width="2.2"/></svg><span><b>NUAN</b><small>RETREAT · KRABI</small></span></a>
  <div class="links"><a href="#rooms" data-t="navRooms"></a><a href="#direct" data-t="navDirect"></a><a href="#exp" data-t="navExp"></a><a href="#dest" data-t="navLoc"></a></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-l="th" aria-pressed="true">TH</button><button type="button" data-l="en" aria-pressed="false">EN</button></div>
  <a class="btn" href="#rooms" data-t="navBook"></a>
</div></nav>

<header class="hero" id="top"><div class="wrap">
  <div class="hg">
    <figure class="arch"><img src="https://images.unsplash.com/photo-1511265753106-52a8e3488b70?auto=format&fit=crop&w=1400&q=80" alt="Villa pool among palm trees" fetchpriority="high"></figure>
    <div>
      <p class="place" data-t="place"></p>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="sky" id="sky"></div>
    </div>
  </div>
  <form class="book" id="search" aria-label="Check availability">
    <div><label for="ci" data-t="ci"></label><input type="date" id="ci" required></div>
    <div><label for="co" data-t="co"></label><input type="date" id="co" required></div>
    <div><label for="gu" data-t="gu"></label><select id="gu"></select></div>
    <button class="btn" data-t="check"></button>
  </form>
</div></header>

<section class="band" id="rooms"><div class="wrap">
  <div class="rhead"><h2 data-t="roomsH"></h2><p id="stay"></p></div>
  <div class="rooms" id="roomList"></div>
</div></section>

<section class="band perks" id="direct"><span class="ghost"></span><span class="ghost"></span><div class="wrap" style="position:relative">
  <h2 data-t="directH"></h2>
  <div class="pk" id="perkList"></div>
  <div class="save" id="save"></div>
</div></section>

<section class="band" id="exp"><div class="wrap">
  <div class="rhead" style="margin-bottom:0"><h2 data-t="expH"></h2><p data-t="expP"></p></div>
  <div class="exg" id="expList"></div>
</div></section>

<section class="band dest" id="dest"><div class="wrap dgrid">
  <div class="dpics">
    <figure class="arch"><img loading="lazy" src="https://images.unsplash.com/photo-1648648777033-c833d650aea7?auto=format&fit=crop&w=1000&q=80" alt="Limestone cliff at Railay"></figure>
    <div class="stack">
      <figure><img loading="lazy" src="https://images.unsplash.com/photo-1483683804023-6ccdb62f86ef?auto=format&fit=crop&w=700&q=80" alt="Islands off Ao Nang from above"></figure>
      <figure><img loading="lazy" src="https://images.unsplash.com/photo-1722483537725-3807a1bb78c7?auto=format&fit=crop&w=700&q=80" alt="Evening over Ao Nang beach"></figure>
    </div>
  </div>
  <div>
    <h2 data-t="locH"></h2>
    <p style="margin-top:16px;color:#3b4747" data-t="locP"></p>
    <ul class="near" id="near"></ul>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn lineb" href="https://line.me/" target="_blank" rel="noopener" data-t="lineBtn"></a><span class="btn line" style="cursor:default">075-000-000</span></div>
    <p class="small" style="margin-top:14px" data-t="contactNote"></p>
  </div>
</div></section>

<footer><div class="wrap">
  <div class="ft"><div><span class="brand"><b>NUAN</b></span><p style="margin-top:12px" data-t="addr"></p></div><p>reservations@nuan-retreat.example · 075-000-000</p></div>
  <div class="credit"><span data-t="foot"></span> <span data-t="photoCredit"></span></div>
</div></footer>

<dialog id="dlg" aria-label="Booking"><div class="dl" id="dlgBody"></div></dialog>

<script>
{
const U=(id,w)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;
const T={
th:{demo:"เว็บไซต์ตัวอย่าง: รีสอร์ตสมมติเพื่อสาธิตงานออกแบบ ไม่มีการจองหรือตัดเงินจริง",navRooms:"ห้องพัก",navDirect:"จองตรง",navExp:"ประสบการณ์",navLoc:"อ่าวนาง",navBook:"จองห้องพัก",
place:"อ่าวนาง · กระบี่",h1:"มองทะเลอันดามัน ผ่านซุ้มผาหินปูน",lead:"รีสอร์ตเล็กๆ เพียง 24 ห้อง ซ่อนตัวอยู่ในซอยเงียบ เดินถึงหาดอ่าวนางได้ในไม่กี่นาที",
rise:"พระอาทิตย์ขึ้นวันนี้",set:"พระอาทิตย์ตกวันนี้",boat:"เรือไปไร่เลย์",boatT:"08:00–18:00",
ci:"เช็กอิน",co:"เช็กเอาต์",gu:"ผู้เข้าพัก",guest:"ท่าน",check:"ดูห้องว่าง",
roomsH:"ห้องพัก",stay:(n,a,b)=>`${a} – ${b} · ${n} คืน · แสดงราคาจองตรงแล้ว`,night:"ต่อคืน",total:"รวม",nights:"คืน",
left:n=>`เหลือ ${n} ห้องในวันที่เลือก`,out:"ห้องเต็มในวันที่เลือก",tooMany:"รองรับผู้เข้าพักไม่ถึงจำนวนที่เลือก",book:"จองห้องนี้",sqm:"ตร.ม.",max:n=>`พักได้ ${n} ท่าน`,
directH:"จองตรงกับเรา ได้มากกว่า",cmpA:"ราคาบนเว็บเอเจนต์",cmpB:"ราคาจองตรง",cmpC:"ส่วนต่าง (Cliff View Deluxe 2 คืน)",
expH:"ระหว่างเข้าพัก",expP:"จองพร้อมห้องพัก หรือแจ้งทีมงานทาง LINE ได้ตลอดการเข้าพัก",
locH:"อ่าวนาง กระบี่",locP:"อยู่ในซอยเงียบ ห่างจากถนนเลียบชายหาด ไปไร่เลย์หรือเกาะต่างๆ ได้ด้วยเรือหางยาวจากหน้าหาด",
lineBtn:"แชทผ่าน LINE",contactNote:"ทีมงานตอบทุกวัน 07:00–22:00",addr:"ถนนตัวอย่าง ตำบลอ่าวนาง อำเภอเมือง กระบี่ (ที่อยู่สมมติ)",

/* Sunrise/sunset for Ao Nang (8.03N, 98.82E, UTC+7), NOAA approximation */
function sun(d){const rad=Math.PI/180,lat=8.032,lon=98.823,tz=7;
  const N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),g=2*Math.PI/365*(N-1);
  const eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const de=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(de))-Math.tan(lat*rad)*Math.tan(de))/rad;
  const t=m=>{m=((m%1440)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(Math.round(m%60)).padStart(2,"0")}`.replace(":60",":59")};
  return [t(720-4*(lon+ha)-eq+tz*60),t(720-4*(lon-ha)-eq+tz*60)]}

function render(){
  const t=T[L],n=Math.max(nights(),1),G=+(gu.value||2);
  document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  gu.innerHTML=[1,2,3,4].map(k=>`<option value="${k}">${k} ${t.guest}</option>`).join("");gu.value=G;
  const [r,s]=sun(new Date());
  $("#sky").innerHTML=`<div><b>${r}</b><span>${t.rise}</span></div><div class="s"><b>${s}</b><span>${t.set}</span></div><div><b>${t.boatT}</b><span>${t.boat}</span></div>`;
  $("#stay").textContent=nights()>0?t.stay(n,fmt(ci.value),fmt(co.value)):t.errDate;
  $("#roomList").innerHTML=rooms.map(r=>{
    const out=r.left===0,small=r.max<G,bad=out||small||nights()<1;
    const st=out?`<p class="status no">${t.out}</p>`:small?`<p class="status no">${t.tooMany}</p>`:r.left<=3?`<p class="status">${t.left(r.left)}</p>`:`<p class="status"></p>`;
    return `<article class="room"><figure class="arch"><img loading="lazy" src="${U(r.img,900)}" alt="${r.name}"><span class="tag">${r.size} ${t.sqm} · ${t.max(r.max)}</span></figure><h3>${r.name}</h3><p class="desc" style="margin-top:8px">${r[L]}</p><div class="rp"><b>${baht(dp(r.price))}</b><s>${baht(r.price)}</s><span class="small">${t.night}</span></div><p class="small">${t.total} ${n} ${t.nights} · ${baht(dp(r.price)*n)}</p>${st}<button class="btn line" data-book="${r.id}" ${bad?"disabled":""}>${t.book}</button></article>`}).join("");
  $("#perkList").innerHTML=perks[L].map(p=>`<div><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join("");
  const g=rooms[0].price*2,d2=dp(rooms[0].price)*2;
  $("#save").innerHTML=`<div>${t.cmpA}<b>${baht(g)}</b></div><div class="us">${t.cmpB}<b>${baht(d2)}</b></div><div>${t.cmpC}<b>${baht(g-d2)}</b></div>`;
  $("#expList").innerHTML=exps[L].map(e=>`<article class="ex"><figure><img loading="lazy" src="${U(e[0],800)}" alt="${e[1]}"></figure><h3>${e[1]}</h3><p>${e[2]}</p><p class="t">${e[3]}</p></article>`).join("");
  $("#near").innerHTML=near[L].map(x=>`<li><span>${x[0]}</span><span>${x[1]}</span></li>`).join("");
}

  const t=T[L],v=k=>esc(B[k]||"");

  <p class="err" id="err" role="alert"></p><div class="acts"><button type="button" class="btn line" id="x">${t.cancel}</button><button class="btn">${t.next}</button></div></form>`;

    step2("card")};
  setTimeout(()=>$("#bn").focus(),30);
}

function qrSvg(seed){let x=seed,c="";const r=()=>(x=(x*1103515245+12345)%2147483648)/2147483648,N=25,s=6;
  const fin=(a,b)=>`<rect x="${a*s}" y="${b*s}" width="${7*s}" height="${7*s}" fill="#111"/><rect x="${(a+1)*s}" y="${(b+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(a+2)*s}" y="${(b+2)*s}" width="${3*s}" height="${3*s}" fill="#111"/>`;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const f=(i<8&&j<8)||(i>16&&j<8)||(i<8&&j>16);if(!f&&r()>.52)c+=`<rect x="${i*s}" y="${j*s}" width="${s}" height="${s}" fill="#111"/>`}
  return `<svg viewBox="0 0 ${N*s} ${N*s}" width="190" height="190" role="img" aria-label="Sample QR">${c}${fin(0,0)}${fin(18,0)}${fin(0,18)}<rect x="${9*s}" y="${10.5*s}" width="${7*s}" height="${4*s}" rx="4" fill="#fff"/><text x="${12.5*s}" y="${13.3*s}" text-anchor="middle" font-size="11" font-family="Anuphan,sans-serif" fill="#a33a2b" font-weight="600">DEMO</text></svg>`}

function step2(mode){
  clearInterval(timer);
  const t=T[L],amt=baht(dp(B.room.price)*B.n);
  const tabs=`<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="${mode==="card"}" data-m="card">${t.card}</button><button type="button" role="tab" aria-selected="${mode==="pp"}" data-m="pp">${t.pp}</button></div>`;
  let inner;
  if(mode==="card"){
    inner=`<p class="testnote">${t.test}</p>
    <div class="card" aria-hidden="true"><div class="row"><span>Nuan Retreat</span><span>VISA</span></div><div class="no" id="cv">4242 4242 4242 4242</div><div class="row"><span id="cvn">${esc(B.name)}</span><span id="cve">12/30</span></div></div>
    <form id="f2" novalidate><div class="f2"><div class="full"><label for="cn">${t.cno}</label><input id="cn" inputmode="numeric" autocomplete="off" value="4242 4242 4242 4242" maxlength="19"></div>
    <div><label for="ce">${t.cexp}</label><input id="ce" inputmode="numeric" autocomplete="off" value="12/30" maxlength="5"></div><div><label for="cc">${t.ccvc}</label><input id="cc" inputmode="numeric" autocomplete="off" value="123" maxlength="3"></div>
    <div class="full"><label for="cm">${t.cname}</label><input id="cm" autocomplete="off" value="${esc(B.name)}"></div></div>
    <p class="err" id="err" role="alert"></p><div class="acts"><button type="button" class="btn line" id="bk">${t.back}</button><button class="btn sun">${t.pay(amt)}</button></div></form>`;
  }else{
    inner=`<div class="qr"><div class="box"><div class="pp">PromptPay</div>${qrSvg(B.n*7919+B.room.price)}<div class="amt">${amt}</div></div><p>${t.ppScan}</p><p class="small" style="color:#a33a2b">${t.ppDemo}</p><p class="timer" id="tm"></p></div>
    <div class="acts"><button type="button" class="btn line" id="bk">${t.back}</button><button type="button" class="btn sun" id="paid">${t.ppPaid}</button></div>`;
  }
  body.innerHTML=`${steps(2)}<h3>${t.payTitle}</h3>${tabs}${inner}`;
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>step2(b.dataset.m));
  $("#bk").onclick=step1;
  if(mode==="card"){
    const cn=$("#cn"),ce=$("#ce"),cc=$("#cc"),cm=$("#cm");
    cn.oninput=()=>{cn.value=cn.value.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();$("#cv").textContent=cn.value||"•••• •••• •••• ••••"};
    ce.oninput=()=>{let v=ce.value.replace(/\D/g,"").slice(0,4);if(v.length>2)v=v.slice(0,2)+"/"+v.slice(2);ce.value=v;$("#cve").textContent=v||"MM/YY"};
    cc.oninput=()=>{cc.value=cc.value.replace(/\D/g,"").slice(0,3)};
    cm.oninput=()=>{$("#cvn").textContent=cm.value};
    $("#f2").onsubmit=e=>{e.preventDefault();
      [cn,ce,cc,cm].forEach(i=>i.classList.remove("bad"));
      const fail=(el,msg)=>{el.classList.add("bad");el.focus();$("#err").textContent=msg};
      if(cn.value.replace(/\s/g,"")!=="4242424242424242")return fail(cn,t.errCard);
      const m=ce.value.match(/^(\d\d)\/(\d\d)$/),now=new Date();
      if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],0)<now)return fail(ce,t.errExp);
      if(!/^\d{3}$/.test(cc.value))return fail(cc,t.errCvc);
      if(!cm.value.trim())return fail(cm,t.errName);
      process(t.card)};

    let left=900;const tick=()=>{const el=$("#tm");if(!el){clearInterval(timer);return}el.textContent=t.ppTime(`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`);if(--left<0)clearInterval(timer)};
    tick();timer=setInterval(tick,1000);
    $("#paid").onclick=()=>process("PromptPay");
  }
}

function process(method){
  clearInterval(timer);
  const t=T[L];
  body.innerHTML=`${steps(2)}<div class="spin" role="status" aria-label="${t.proc}"></div><p style="text-align:center">${t.proc}</p>`;
  setTimeout(()=>{
    const ref="NR-"+Math.random().toString(36).slice(2,7).toUpperCase(),amt=baht(dp(B.room.price)*B.n);
    body.innerHTML=`${steps(4)}<div class="ok"><div class="arch"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 21l7 7 14-15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h3>${t.okH}</h3><div class="ref">${ref}</div><p>${t.okP(esc(B.email),amt)}</p></div>${summary()}<p class="small" style="text-align:center">${t.paidBy} ${method} · ${t.okDemo}</p><div class="acts" style="justify-content:center"><button class="btn" id="cl">${t.close}</button></div>`;
    $("#cl").onclick=()=>dlg.close();
  },1600);
}

$("#roomList").onclick=e=>{const b=e.target.closest("[data-book]");if(b&&!b.disabled)openBook(b.dataset.book)};
render();
}
</script>
