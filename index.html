<style>
/* Home: full-screen slider, booking panel on its lower edge, then the house, rooms, a day at Nuan, experiences, offers, pictures and location. */
.hero{position:relative;height:100svh;min-height:640px;max-height:1040px;background:var(--night);color:#fff;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{position:absolute;inset:0;transform:scale(1.06);transition:transform 10s ease-out}
.slide.on img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0F1D1A80 0%,#0F1D1A00 22%,#0F1D1A00 50%,#0F1D1Ab8 100%),radial-gradient(ellipse 70% 60% at 18% 82%,#0F1D1A73,#0F1D1A00 70%);pointer-events:none;z-index:1}
.cap{position:absolute;left:0;right:0;bottom:clamp(170px,22vh,230px);z-index:2}
.cap h1,.cap h2{font-size:clamp(32px,4.2vw,62px);font-weight:300;max-width:17ch;line-height:1.32;text-shadow:0 2px 30px #0F1D1A59}
.cap .wrap>*{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.slide.on .cap .wrap>*{opacity:1;transform:none}
.slide.on .cap .wrap>*:nth-child(1){transition-delay:.35s}.slide.on .cap .wrap>*:nth-child(2){transition-delay:.6s}
.cap .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;justify-content:flex-start}
.sctl{position:absolute;z-index:3;right:max(5vw,20px);bottom:clamp(170px,22vh,230px);display:flex;align-items:center;gap:16px;color:#fff}
.dots{display:flex;gap:6px}
.dots button{width:40px;height:44px;border:0;background:none;cursor:pointer;padding:0;position:relative}
.dots button::before{content:"";position:absolute;left:0;right:0;top:21px;height:1px;background:#ffffff59}
.dots button[aria-current=true]::before{background:var(--brass2);height:2px;top:20px}
.count{font:300 15px var(--f-d);min-width:56px;text-align:right;letter-spacing:.06em}
.bkb{position:absolute;z-index:4;left:0;right:0;bottom:0}
.bkf{background:var(--paper);color:var(--ink);display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:stretch;box-shadow:0 -10px 40px #0F1D1A33}
.bkf .field{padding:22px 28px;border-right:1px solid var(--line)}
.bkf .btn{min-height:auto;padding:0 44px;border-radius:0;font-size:16px}
.intro{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(40px,7vw,120px);align-items:center}
.pair{display:grid;grid-template-columns:3fr 2fr;gap:18px;align-items:end}
.pair figure:first-child{aspect-ratio:3/4.2;border-radius:var(--arch)}.pair figure:last-child{aspect-ratio:3/4;margin-bottom:72px}
.rcard{text-decoration:none;display:block;color:#fff}
.rcard figure{aspect-ratio:3/4;border-radius:var(--arch)}
.rcard img{transition:transform 1.1s ease}.rcard:hover img{transform:scale(1.045)}
.rcard .rm{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-top:22px;flex-wrap:wrap}
.rcard h3{font-size:26px;font-weight:300}
.rcard p{color:var(--fog);font-size:14.5px;margin-top:6px}
.rcard .pr{white-space:nowrap;font-size:14px;color:var(--fog)}.rcard .pr b{font:400 22px var(--f-d);color:var(--brass2)}
.xgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.xt{position:relative;display:block;aspect-ratio:3/4.4;overflow:hidden;color:#fff;text-decoration:none;background:var(--night)}
.xt:nth-child(even){margin-top:56px}
.xt img{position:absolute;inset:0;transition:transform 1.2s ease,opacity .4s}
.xt:hover img{transform:scale(1.06);opacity:.85}
.xt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0F1D1A00 40%,#0F1D1Ae6 100%)}
.xt div{position:absolute;left:24px;right:24px;bottom:24px;z-index:2}
.xt h3{font-size:clamp(22px,2vw,28px);font-weight:300}
.xt p{font-size:14px;color:#D9E0DC;margin-top:6px}
.xt .tlink{margin-top:14px;color:#fff;border-color:var(--brass2)}
@media(max-width:1100px){.sctl .cbtn,.count{display:none}}
@media(max-width:1080px){.xgrid{grid-template-columns:1fr 1fr}.xt:nth-child(even){margin-top:0}.xt:nth-child(odd){margin-top:0}}
@media(max-width:960px){.intro{grid-template-columns:1fr}.pair figure:last-child{margin-bottom:0}
 .bkf{grid-template-columns:1fr 1fr 1fr}.bkf .btn{grid-column:1/-1;min-height:56px}}
@media(max-width:720px){.cap{bottom:auto;top:calc(var(--annh,40px) + 130px)}.sctl{bottom:auto;top:calc(var(--annh,40px) + 84px);right:auto;left:max(5vw,20px)}.sctl .cbtn,.count{display:none}
 .bkf{grid-template-columns:1fr 1fr}.bkf .field{padding:14px 18px;border-bottom:1px solid var(--line)}.bkf .field:nth-child(2){border-right:0}.bkf .field:nth-child(3){grid-column:1/-1;border-right:0}
 .xgrid{grid-template-columns:1fr}.xt{aspect-ratio:4/4.4}}
@media(prefers-reduced-motion:reduce){.slide,.slide img{transition:none}}
</style>
</head>

  $("#hl6").innerHTML=h.hl.map(f=>`<div><b>${f[0]}</b><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join("");
  $("#rvw").innerHTML=h.rv.map(r=>`<figure class="rvc rv" style="margin:0"><span class="tag">${h.rvTag}</span><span class="st" aria-hidden="true">★★★★★</span><q>${r[0]}</q><figcaption class="who">${r[1]}</figcaption></figure>`).join("");
  $("#roomTrack").innerHTML=ROOMS.map(r=>`<a class="rcard" href="room.html?r=${r.id}"><figure><img loading="lazy" src="${U(r.gal[0][0],900)}" alt="${r.name}"></figure><div class="rm"><h3>${r.name}</h3><span class="pr">${x.from} <b>${baht(rate(r))}</b></span></div><p>${r.size} ${x.sqm} · ${r.vw[L]} · ${x.max(r.max)}</p></a>`).join("");
  $("#xgrid").innerHTML=h.ex.map(e=>`<a class="xt rv" href="${e[0]}"><img loading="lazy" src="${U(e[1],800)}" alt=""><div><h3>${e[2]}</h3><p>${e[3]}</p><span class="tlink">${x.more}${arr()}</span></div></a>`).join("");
  $("#offTrack").innerHTML=OFFERS.map(offerCard).join("");
  document.querySelectorAll(".car").forEach(c=>{c.querySelector(".cbslot").innerHTML=cbtns();carousel(c)});
  reveal();
}
$("#sprev").onclick=()=>{go(cur-1);auto()};$("#snext").onclick=()=>{go(cur+1);auto()};
$("#hero").addEventListener("mouseenter",()=>clearInterval(timer));$("#hero").addEventListener("mouseleave",auto);
let sx=null;$("#hero").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});$("#hero").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){go(cur+(dx<0?1:-1));auto()}sx=null});
$("#bkf").onsubmit=e=>{e.preventDefault();location.href="book.html"};
window.__rerender=render;render();auto();
}
</script>
</body>
