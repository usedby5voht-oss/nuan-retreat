<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooms · Nuan Retreat Krabi</title>
<meta name="description" content="Nuan Retreat — a small 24-room retreat in Ao Nang, Krabi. Demo website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Rooms list: hero, a pinned bar of category chips and dates, then rooms as wide alternating rows. */
.bar{position:sticky;top:var(--navh,84px);z-index:30;background:#F2F1EDf2;backdrop-filter:blur(12px);padding:14px 0;border-bottom:1px solid var(--line)}
.bi{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none}
.chips button span{opacity:.6;font-size:12.5px;margin-left:6px}
.stay{display:grid;grid-template-columns:repeat(3,auto);border:1px solid var(--line);background:#fff}
.stay .field{padding:6px 16px}.stay .field+.field{border-left:1px solid var(--line)}
.stay input{width:140px}.stay select{width:96px}
.count{margin:36px 0 0;color:var(--mute);font-size:14.5px}
.list{display:grid;gap:clamp(56px,8vw,110px);margin-top:36px}
.rc{text-decoration:none;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center}
.rc:nth-child(even) figure{order:2}
.rc figure{aspect-ratio:4/4.3;border-radius:var(--arch)}
.rc img{transition:transform 1.1s ease}.rc:hover img{transform:scale(1.04)}
.rc .n{position:absolute;right:16px;bottom:16px;background:#0F1D1Acc;color:#fff;font-size:12.5px;padding:4px 12px}
.rc h2{font-size:clamp(34px,3.6vw,52px)}
.rc .s{color:var(--mute);font-size:17px;margin:14px 0 20px;max-width:44ch}
.rc .p{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rc .p b{font:300 38px var(--f-d);white-space:nowrap}.rc .p s{color:var(--mute);font-size:14px}
.rc h2 a{text-decoration:none}.rc h2 a:hover{color:var(--brassd)}.rc .fl{display:block}
.am5{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14.5px;color:var(--mute)}
.am5 li{display:flex;gap:10px;align-items:baseline}.am5 li::before{content:"";flex:none;width:7px;height:9px;border:1.2px solid var(--brass);border-bottom:0;border-radius:var(--arch)}
.rcb{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.empty{padding:80px 0;text-align:center;color:var(--mute)}
@media(max-width:900px){.rc{grid-template-columns:1fr}.rc:nth-child(even) figure{order:0}.rc figure{aspect-ratio:4/3.6}}
@media(max-width:820px){.stay{width:100%;grid-template-columns:1fr 1fr auto}.stay input,.stay select{width:100%}}
@media(max-width:560px){.stay{grid-template-columns:1fr 1fr}.stay .field:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header id="hdr"></header>
<section class="ph"><img src="https://images.unsplash.com/photo-1729606188713-814d1b7bf893?auto=format&fit=crop&w=2000&q=80" alt="" fetchpriority="high"><div class="wrap"><p class="crumb"><a href="index.html" data-t="navHome"></a> / <span data-t="navRooms"></span></p><h1 data-t="listH"></h1><p class="lead" data-t="listP"></p></div></section>
<div class="bar"><div class="wrap bi">
  <div class="chips" id="chips" role="group" aria-label="Room categories"></div>
  <form class="stay" onsubmit="return false">
    <div class="field"><label for="ci" data-t="ci"></label><input type="date" id="ci"></div>
    <div class="field"><label for="co" data-t="co"></label><input type="date" id="co"></div>
    <div class="field"><label for="gu" data-t="gu"></label><select id="gu"></select></div>
  </form>
</div></div>
<main class="wrap" style="padding-bottom:clamp(80px,10vw,140px)">
  <div id="offbar"></div>
  <p class="count" id="count"></p>
  <div class="list" id="grid"></div>
</main>
<script src="common.js"></script>
<script>
{
const h=location.hash.slice(1);
if(ROOMS.some(r=>r.id===h))location.replace("room.html?r="+h);
let cat=CATS.includes(h)?h:"all";
const refill=bindStay($("#ci"),$("#co"),$("#gu"),render);
function render(){
  header("rooms",true);onLang(render);
  const x=t();applyText();refill();
  $("#chips").innerHTML=CATS.map(c=>{const n=c==="all"?ROOMS.length:ROOMS.filter(r=>r.cats.includes(c)).length;return `<button type="button" data-c="${c}" aria-pressed="${c===cat}">${x.cats[c]}<span>${n}</span></button>`}).join("");
  $("#offbar").innerHTML=offerBar(null);
  const list=ROOMS.filter(r=>cat==="all"||r.cats.includes(cat)),n=Math.max(nights(),1);
  $("#count").textContent=`${x.count(list.length)} · ${nights()>0?x.stay(n,fmt(S.ci),fmt(S.co)):x.errDate}`;
  $("#grid").innerHTML=list.length?list.map(r=>{const [st,bad]=status(r);return `<article class="rc rv"><a href="room.html?r=${r.id}" class="fl"><figure><img loading="lazy" src="${U(r.gal[0][0],1200)}" alt="${r.name}"><span class="n">${r.gal.length} ${x.pics}</span></figure></a>
    <div><span class="mark"></span><h2><a href="room.html?r=${r.id}">${r.name}</a></h2><p class="s">${r.short[L]}</p><div class="tags"><span>${r.size} ${x.sqm}</span><span>${x.max(r.max)}</span><span>${r.bed[L]}</span><span>${r.vw[L]}</span></div>
    <ul class="am5" aria-label="${x.amH}">${r.am[L].slice(0,6).map(a=>`<li>${a}</li>`).join("")}</ul>
    <p class="p"><span class="small">${x.from}</span> <b>${baht(rate(r))}</b><s>${baht(r.price)}</s> <span class="small">${x.night}</span></p>${OFF&&!offerOk(OFF,r)?`<p class="small">${t().offPct(10)} · ${t().disc}</p>`:""}${st}
    <div class="rcb"><a class="btn gold" href="book.html?r=${r.id}"${bad?' aria-disabled="true" style="opacity:.4;pointer-events:none"':""}>${x.bookNow}</a><a class="btn line" href="room.html?r=${r.id}">${x.details}</a></div></div></article>`}).join(""):`<p class="empty">${x.empty}</p>`;
  reveal();
}
$("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;history.replaceState(null,"",cat==="all"?"rooms.html":"#"+cat);render()};
window.__rerender=render;render();
}
</script>
</body>
</html>
