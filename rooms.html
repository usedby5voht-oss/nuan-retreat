<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooms · Nuan Retreat Krabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Trirong:wght@300;400;500&family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: clear and practical, the shop counter after the story; same arch language as the home page.
   IDEA: a room card is a cave mouth: arched photograph of the room, with the view from it in a smaller frame beside.
   PICTURE: each room is a full-width row; dates and guests stay pinned in one slim bar so prices update live.
   COLOUR and TYPE: white, limestone #f1ede6, deep Andaman #0e2f33, sunset #d8642f for pay; Gloock, Trirong, Anuphan.
   LAYOUT: title and booking bar, perks strip, three room rows, policies, footer; checkout in a dialog. */
:root{color-scheme:light;--bg:#fff;--stone:#f1ede6;--ink:#152224;--soft:#66706f;--deep:#0e2f33;--sun:#d8642f;--line:#e2ddd4;--arch:1000px 1000px 0 0}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:170px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16.5px/1.75 Anuphan,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Gloock,Trirong,serif;font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
:lang(th) h1,:lang(th) h2,:lang(th) h3{font-family:Trirong,Gloock,serif;line-height:1.35}
h2{font-size:clamp(30px,3.4vw,44px)}h3{font-size:24px}
p{margin:0}a{color:inherit}
img{display:block;width:100%;height:100%;object-fit:cover;background:var(--stone)}
figure{margin:0;overflow:hidden;position:relative}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,20px)}
.small{font-size:13.5px;color:var(--soft)}
.arch{border-radius:var(--arch);overflow:hidden;margin:0;position:relative}
.demo{background:var(--deep);color:#c9d6d4;font-size:12.5px;text-align:center;padding:6px 14px}
nav{position:sticky;top:0;z-index:40;background:#ffffffeb;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;gap:30px;height:74px}
.brand{text-decoration:none;display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:30px;height:34px}
.brand b{font:400 25px/1 Gloock,serif;letter-spacing:.08em}
.brand small{display:block;font:400 10.5px Anuphan;letter-spacing:.24em;color:var(--soft);margin-top:5px}
.links{display:flex;gap:28px}.links a{text-decoration:none;font-size:15px;color:#3b4747}
.links a[aria-current]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.lang{display:flex}.lang button{background:none;border:0;color:var(--soft);min-width:38px;min-height:42px;font:500 13px Anuphan;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid var(--deep);background:var(--deep);color:#fff;font:400 15px Anuphan;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:#082024}
.btn.line{background:transparent;color:var(--ink)}.btn.line:hover{background:var(--stone)}
.btn.sun{background:var(--sun);border-color:var(--sun)}.btn.sun:hover{background:#bf5323}
.btn[disabled]{opacity:.35;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
/* head */
.top{padding:clamp(36px,5vw,64px) 0 26px}
.top .kick{font-size:14px;color:var(--soft);letter-spacing:.06em;margin-bottom:12px}
.top h1{font-size:clamp(42px,5.6vw,76px)}
:lang(th) .top h1{font-size:clamp(38px,5vw,66px);line-height:1.25}
.top p.body{color:#3b4747;max-width:56ch;margin-top:14px;font-size:17px}
/* sticky booking bar */
.barwrap{position:sticky;top:74px;z-index:30;background:#ffffffee;backdrop-filter:blur(10px);padding:12px 0}
.book{background:var(--stone);border-radius:999px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:center;padding:6px 8px 6px 30px}
.book>div{padding:6px 18px 6px 0}
.book>div+div{padding-left:18px;border-left:1px solid #d9d2c6}
.book label{display:block;font-size:12.5px;color:var(--soft)}
.book input,.book select{width:100%;border:0;background:transparent;font:400 16px Anuphan;color:var(--ink);padding:2px 0;min-height:30px}
.book .sum2{font-size:14px;color:#3b4747;padding-right:14px;white-space:nowrap}
/* perks strip */
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:30px 0 10px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.perks b{display:block;font-weight:500;font-size:15.5px}
.perks span{font-size:14px;color:var(--soft)}
/* room rows */
.room{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,80px);align-items:center;padding:clamp(48px,6vw,80px) 0;border-bottom:1px solid var(--line)}
.room:nth-child(even) .gal{order:2}
.room.hl{animation:hl 2.4s ease}
@keyframes hl{0%,40%{background:#f1ede6aa}100%{background:transparent}}
.gal{display:grid;grid-template-columns:5fr 2fr;gap:14px;align-items:end}
.gal .arch{aspect-ratio:3/3.9}
.gal .view{aspect-ratio:3/4;border-radius:20px;margin-bottom:40px}
.gal .view span{position:absolute;left:10px;bottom:10px;background:#0e2f33cc;color:#fff;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.room .meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 16px}
.room .meta span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}
.room .desc{color:#3b4747}
.am{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:15px;color:#3b4747}
.am li{display:flex;gap:10px;align-items:baseline}
.am li::before{content:"";flex:none;width:9px;height:11px;border:1.5px solid var(--sun);border-bottom:0;border-radius:var(--arch);transform:translateY(1px)}
.rp{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 2px}
.rp b{font:400 34px/1 Gloock,serif;white-space:nowrap}.rp s{color:var(--soft);font-size:14px;white-space:nowrap}
.status{font-size:13.5px;color:#9a5a1c;min-height:22px;margin:6px 0 14px}.status.no{color:#a33a2b}
/* policies */
.pol{background:var(--stone);padding:clamp(56px,7vw,96px) 0;margin-top:clamp(40px,6vw,80px)}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:30px}
.pg div{border-top:1px solid #d6cec1;padding-top:16px}
.pg b{display:block;font-weight:500;margin-bottom:4px}
.pg p{color:#3b4747;font-size:15px}
footer{background:var(--deep);color:#a9bcba;font-size:14px;padding:48px 0 34px}
.ft{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end}
.ft .brand b{color:#fff}
.credit{margin-top:28px;padding-top:16px;border-top:1px solid #ffffff22;font-size:12.5px}
/* checkout */
dialog{border:0;padding:0;width:min(560px,96vw);max-height:94vh;background:#fff;color:var(--ink);border-radius:28px;box-shadow:0 40px 90px #0007}
dialog::backdrop{background:#0e2f33d9}
.dl{padding:30px 32px 32px}
.steps{display:flex;gap:8px;margin-bottom:20px;font-size:13px;color:var(--soft)}
.steps span{display:flex;align-items:center;gap:6px}
.steps i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.steps .on{color:var(--ink)}.steps .on i{background:var(--deep);border-color:var(--deep);color:#fff}
.steps .done i{background:var(--stone)}
.steps em{flex:1;height:1px;background:var(--line);align-self:center;min-width:12px}
.dl h3{font-size:28px}
.sum{margin:16px 0;font-size:15px;background:var(--stone);border-radius:18px;padding:6px 18px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ddd6ca}
.sum div:last-child{border:0}
.sum span:last-child{white-space:nowrap;text-align:right}
.sum .tot{font-weight:500;font-size:17px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f2 .full{grid-column:1/-1}
.f2 label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:4px}
.f2 input{width:100%;border:1px solid #d6d1c8;border-radius:12px;font:400 16px Anuphan;padding:0 14px;min-height:48px;background:#fff;color:var(--ink)}
.f2 input.bad{border-color:#a33a2b}
.err{color:#a33a2b;font-size:14px;min-height:22px;margin-top:8px}
.acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--stone);border-radius:999px;padding:4px;margin:16px 0 18px}
.tabs button{border:0;background:transparent;border-radius:999px;min-height:42px;font:400 15px Anuphan;color:var(--soft);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}
.card{position:relative;aspect-ratio:1.6;max-width:300px;margin:0 auto 18px;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#0e2f33,#1d5a5f 60%,#d8642f);display:flex;flex-direction:column;justify-content:space-between;font-size:13px;overflow:hidden}
.card::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:200px;border:1px solid #ffffff33;border-radius:var(--arch)}
.card .no{font:400 19px/1 Gloock,serif;letter-spacing:.12em;white-space:nowrap}
.card .row{display:flex;justify-content:space-between;gap:8px;text-transform:uppercase}
.testnote{font-size:13px;background:#fff6e8;border:1px solid #f0dcb8;border-radius:12px;padding:10px 12px;margin-bottom:14px;color:#6b4a14}
.qr{display:grid;justify-items:center;gap:8px;text-align:center}
.qr .box{width:220px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff}
.qr .pp{background:#113566;color:#fff;border-radius:8px;padding:4px 10px;font:500 13px Anuphan;margin-bottom:10px}
.qr .amt{font:400 28px Gloock,serif}
.qr .timer{font-size:13.5px;color:var(--soft)}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--stone);border-top-color:var(--deep);margin:22px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{text-align:center}
.ok .arch{width:96px;height:110px;margin:6px auto 16px;background:var(--deep);display:grid;place-items:center}
.ref{font:400 30px Gloock,serif;letter-spacing:.1em;margin:8px 0 12px}
@media(max-width:960px){.links{display:none}.perks{grid-template-columns:1fr 1fr}.room{grid-template-columns:1fr}.room:nth-child(even) .gal{order:0}.pg{grid-template-columns:1fr}.book .sum2{display:none}.book{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.nv>.btn{display:none}.brand b{font-size:21px}html{scroll-padding-top:230px}
.book{border-radius:22px;grid-template-columns:1fr 1fr;padding:8px 14px}.book>div{padding:6px 10px 6px 0}.book>div+div{padding-left:10px}.book>div:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid #d9d2c6}
.gal{grid-template-columns:1fr}.gal .view{display:none}.gal .arch{aspect-ratio:4/4.3}.am{grid-template-columns:1fr}.f2{grid-template-columns:1fr}.dl{padding:22px 20px 24px}.steps b{display:none}.perks{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.room.hl,.spin{animation:none}html{scroll-behavior:auto}}
</style>
</head>

const rooms=[
{id:"deluxe",name:"Cliff View Deluxe",img:"photo-1617325247661-675ab4b64ae2",viewImg:"photo-1648648777033-c833d650aea7",size:40,max:2,price:5200,left:2,

{id:"suite",name:"Andaman Suite",img:"photo-1729606188713-814d1b7bf893",viewImg:"photo-1483683804023-6ccdb62f86ef",size:62,max:3,price:8900,left:3,

 am:{th:["ทางลงสระส่วนตัว","ฝักบัวกลางแจ้ง","ผ้าเช็ดตัวสระว่ายน้ำ","เครื่องชงกาแฟ","Wi-Fi ความเร็วสูง","ของเล่นน้ำสำหรับเด็ก"],en:["Private pool steps","Outdoor shower","Pool towels","Coffee machine","Fast Wi-Fi","Pool toys for kids"]}}];

let L="th";try{L=localStorage.getItem("nuan-lang")||"th"}catch(e){}
const $=s=>document.querySelector(s),ci=$("#ci"),co=$("#co"),gu=$("#gu"),dlg=$("#dlg"),body=$("#dlgBody");
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
ci.value=add(21);co.value=add(23);ci.min=add(0);co.min=add(1);
const baht=n=>(L==="th"?"฿":"THB ")+n.toLocaleString("en-US");
const fmt=s=>new Date(s+"T00:00").toLocaleDateString(L==="th"?"th-TH":"en-GB",{day:"numeric",month:"short"});
const nights=()=>Math.round((new Date(co.value+"T00:00")-new Date(ci.value+"T00:00"))/864e5);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dp=p=>Math.round(p*.9);

function render(){
  const t=T[L],n=Math.max(nights(),1),G=+(gu.value||2);
  document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  gu.innerHTML=[1,2,3,4].map(k=>`<option value="${k}">${k} ${t.guest}</option>`).join("");gu.value=G;
  $("#stay").textContent=nights()>0?t.stay(n,fmt(ci.value),fmt(co.value)):t.errDate;
  $("#perks").innerHTML=t.perks.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span></div>`).join("");
  $("#roomList").innerHTML=rooms.map(r=>{
    const out=r.left===0,small=r.max<G,bad=out||small||nights()<1;
    const st=out?`<p class="status no">${t.out}</p>`:small?`<p class="status no">${t.tooMany}</p>`:r.left<=3?`<p class="status">${t.left(r.left)}</p>`:`<p class="status"></p>`;
    return `<article class="room" id="${r.id}"><div class="gal"><figure class="arch"><img loading="lazy" src="${U(r.img,1200)}" alt="${r.name}"></figure><figure class="view"><img loading="lazy" src="${U(r.viewImg,500)}" alt="${t.view}"><span>${t.view}</span></figure></div>
    <div><h2>${r.name}</h2><div class="meta"><span>${r.size} ${t.sqm}</span><span>${t.max(r.max)}</span><span>${r.bed[L]}</span><span>${r.vw[L]}</span></div><p class="desc">${r[L]}</p><ul class="am">${r.am[L].map(a=>`<li>${a}</li>`).join("")}</ul>
    <div class="rp"><b>${baht(dp(r.price))}</b><s>${baht(r.price)}</s><span class="small">${t.night}</span></div><p class="small">${t.total} ${n} ${t.nights} · ${baht(dp(r.price)*n)}</p>${st}<button class="btn" data-book="${r.id}" ${bad?"disabled":""}>${t.book}</button></div></article>`}).join("");
  $("#pol").innerHTML=t.pol.map(p=>`<div><b>${p[0]}</b><p>${p[1]}</p></div>`).join("");
}

/* ---------- checkout ---------- */
let B={},timer=null;
const steps=k=>{const t=T[L];return `<div class="steps">${[t.s1,t.s2,t.s3].map((s,i)=>`<span class="${i+1===k?"on":i+1<k?"done":""}"><i>${i+1<k?"✓":i+1}</i><b>${s}</b></span>`).join("<em></em>")}</div>`};
const summary=()=>{const t=T[L],r=B.room,n=B.n,d=dp(r.price);return `<div class="sum"><div><span>${t.room}</span><span>${r.name}</span></div><div><span>${t.dates}</span><span>${fmt(ci.value)} – ${fmt(co.value)} · ${n} ${t.nights}</span></div><div><span>${t.perN}</span><span>${baht(r.price)}</span></div><div><span>${t.disc}</span><span>−${baht((r.price-d)*n)}</span></div><div class="tot"><span>${t.total}</span><span>${baht(d*n)}</span></div></div>`};

function step1(){
  const t=T[L],v=k=>esc(B[k]||"");
  body.innerHTML=`${steps(1)}<h3>${t.sumTitle}</h3>${summary()}
  <form id="f1" novalidate><div class="f2"><div class="full"><label for="bn">${t.name}</label><input id="bn" autocomplete="name" value="${v("name")}"></div><div><label for="bp">${t.phone}</label><input id="bp" type="tel" autocomplete="tel" value="${v("phone")}"></div><div><label for="be">${t.email}</label><input id="be" type="email" autocomplete="email" value="${v("email")}"></div><div class="full"><label for="br">${t.req}</label><input id="br" value="${v("req")}"></div></div>
  <p class="err" id="err" role="alert"></p><div class="acts"><button type="button" class="btn line" id="x">${t.cancel}</button><button class="btn">${t.next}</button></div></form>`;
  $("#x").onclick=()=>dlg.close();
  $("#f1").onsubmit=e=>{e.preventDefault();
    B.name=$("#bn").value.trim();B.phone=$("#bp").value.trim();B.email=$("#be").value.trim();B.req=$("#br").value.trim();
    if(!B.name||!B.phone||!/^\S+@\S+\.\S+$/.test(B.email)){$("#err").textContent=t.errFill;return}
    step2("card")};
  setTimeout(()=>$("#bn").focus(),30);
}

function qrSvg(seed){let x=seed,c="";const r=()=>(x=(x*1103515245+12345)%2147483648)/2147483648,N=25,s=6;
  const fin=(a,b)=>`<rect x="${a*s}" y="${b*s}" width="${7*s}" height="${7*s}" fill="#111"/><rect x="${(a+1)*s}" y="${(b+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(a+2)*s}" y="${(b+2)*s}" width="${3*s}" height="${3*s}" fill="#111"/>`;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const f=(i<8&&j<8)||(i>16&&j<8)||(i<8&&j>16);if(!f&&r()>.52)c+=`<rect x="${i*s}" y="${j*s}" width="${s}" height="${s}" fill="#111"/>`}
  return `<svg viewBox="0 0 ${N*s} ${N*s}" width="190" height="190" role="img" aria-label="Sample QR">${c}${fin(0,0)}${fin(18,0)}${fin(0,18)}<rect x="${9*s}" y="${10.5*s}" width="${7*s}" height="${4*s}" rx="4" fill="#fff"/><text x="${12.5*s}" y="${13.3*s}" text-anchor="middle" font-size="11" font-family="Anuphan,sans-serif" fill="#a33a2b" font-weight="600">DEMO</text></svg>`}

function step2(mode){
  clearInterval(timer);
  const t=T[L],amt=baht(dp(B.room.price)*B.n);
  const tabs=`<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="${mode==="card"}" data-m="card">${t.card}</button><button type="button" role="tab" aria-selected="${mode==="pp"}" data-m="pp">${t.pp}</button></div>`;
  let inner;
  if(mode==="card"){
    inner=`<p class="testnote">${t.test}</p>
    <div class="card" aria-hidden="true"><div class="row"><span>Nuan Retreat</span><span>VISA</span></div><div class="no" id="cv">4242 4242 4242 4242</div><div class="row"><span id="cvn">${esc(B.name)}</span><span id="cve">12/30</span></div></div>
    <form id="f2" novalidate><div class="f2"><div class="full"><label for="cn">${t.cno}</label><input id="cn" inputmode="numeric" autocomplete="off" value="4242 4242 4242 4242" maxlength="19"></div>
    <div><label for="ce">${t.cexp}</label><input id="ce" inputmode="numeric" autocomplete="off" value="12/30" maxlength="5"></div><div><label for="cc">${t.ccvc}</label><input id="cc" inputmode="numeric" autocomplete="off" value="123" maxlength="3"></div>
    <div class="full"><label for="cm">${t.cname}</label><input id="cm" autocomplete="off" value="${esc(B.name)}"></div></div>
    <p class="err" id="err" role="alert"></p><div class="acts"><button type="button" class="btn line" id="bk">${t.back}</button><button class="btn sun">${t.pay(amt)}</button></div></form>`;
  }else{
    inner=`<div class="qr"><div class="box"><div class="pp">PromptPay</div>${qrSvg(B.n*7919+B.room.price)}<div class="amt">${amt}</div></div><p>${t.ppScan}</p><p class="small" style="color:#a33a2b">${t.ppDemo}</p><p class="timer" id="tm"></p></div>
    <div class="acts"><button type="button" class="btn line" id="bk">${t.back}</button><button type="button" class="btn sun" id="paid">${t.ppPaid}</button></div>`;
  }
  body.innerHTML=`${steps(2)}<h3>${t.payTitle}</h3>${tabs}${inner}`;
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>step2(b.dataset.m));
  $("#bk").onclick=step1;
  if(mode==="card"){
    const cn=$("#cn"),ce=$("#ce"),cc=$("#cc"),cm=$("#cm");
    cn.oninput=()=>{cn.value=cn.value.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();$("#cv").textContent=cn.value||"•••• •••• •••• ••••"};
    ce.oninput=()=>{let v=ce.value.replace(/\D/g,"").slice(0,4);if(v.length>2)v=v.slice(0,2)+"/"+v.slice(2);ce.value=v;$("#cve").textContent=v||"MM/YY"};
    cc.oninput=()=>{cc.value=cc.value.replace(/\D/g,"").slice(0,3)};
    cm.oninput=()=>{$("#cvn").textContent=cm.value};
    $("#f2").onsubmit=e=>{e.preventDefault();
      [cn,ce,cc,cm].forEach(i=>i.classList.remove("bad"));
      const fail=(el,msg)=>{el.classList.add("bad");el.focus();$("#err").textContent=msg};
      if(cn.value.replace(/\s/g,"")!=="4242424242424242")return fail(cn,t.errCard);
      const m=ce.value.match(/^(\d\d)\/(\d\d)$/),now=new Date();
      if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],0)<now)return fail(ce,t.errExp);
      if(!/^\d{3}$/.test(cc.value))return fail(cc,t.errCvc);
      if(!cm.value.trim())return fail(cm,t.errName);
      process(t.card)};
  }else{
    let left=900;const tick=()=>{const el=$("#tm");if(!el){clearInterval(timer);return}el.textContent=t.ppTime(`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`);if(--left<0)clearInterval(timer)};
    tick();timer=setInterval(tick,1000);
    $("#paid").onclick=()=>process("PromptPay");
  }
}

function process(method){
  clearInterval(timer);
  const t=T[L];
  body.innerHTML=`${steps(2)}<div class="spin" role="status" aria-label="${t.proc}"></div><p style="text-align:center">${t.proc}</p>`;
  setTimeout(()=>{
    const ref="NR-"+Math.random().toString(36).slice(2,7).toUpperCase(),amt=baht(dp(B.room.price)*B.n);
    body.innerHTML=`${steps(4)}<div class="ok"><div class="arch"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 21l7 7 14-15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h3>${t.okH}</h3><div class="ref">${ref}</div><p>${t.okP(esc(B.email),amt)}</p></div>${summary()}<p class="small" style="text-align:center">${t.paidBy} ${method} · ${t.okDemo}</p><div class="acts" style="justify-content:center"><button class="btn" id="cl">${t.close}</button></div>`;
    $("#cl").onclick=()=>dlg.close();
  },1600);
}

function openBook(id){B={room:rooms.find(x=>x.id===id),n:nights(),name:B.name,phone:B.phone,email:B.email};step1();dlg.showModal()}
dlg.addEventListener("close",()=>clearInterval(timer));

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("nuan-lang",L)}catch(e){}render()});
$("#search").onsubmit=e=>e.preventDefault();
[ci,co,gu].forEach(i=>i.onchange=()=>{if(i===ci&&co.value<=ci.value){const d=new Date(ci.value+"T00:00");d.setDate(d.getDate()+1);co.value=iso(d)}co.min=ci.value;render()});
$("#roomList").onclick=e=>{const b=e.target.closest("[data-book]");if(b&&!b.disabled)openBook(b.dataset.book)};
render();
const h=location.hash.slice(1),el=h&&document.getElementById(h);
if(el){setTimeout(()=>{el.scrollIntoView();el.classList.add("hl")},60)}
}
</script>
</body>
</html>
