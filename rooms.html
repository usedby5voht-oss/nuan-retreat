<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooms · Nuan Retreat Krabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Trirong:wght@300;400;500&family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Rooms list: arched room cards in a grid, filtered by category chips that stay pinned with the dates. */
.top{padding:clamp(32px,4.5vw,60px) 0 18px}
.kick{font-size:14px;color:var(--soft);letter-spacing:.06em;margin-bottom:12px}
.top h1{font-size:clamp(40px,5.4vw,72px)}
:lang(th) .top h1{font-size:clamp(36px,4.8vw,62px);line-height:1.25}
.top .body{color:#3b4747;max-width:58ch;margin-top:12px;font-size:17px}
.bar{position:sticky;top:var(--navh,75px);z-index:30;background:#ffffffee;backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid var(--line)}
.bi{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;min-height:42px;padding:0 18px;font:400 15px Anuphan;color:#3b4747;cursor:pointer;white-space:nowrap}
.chips button span{color:var(--soft);font-size:13px;margin-left:6px}
.chips button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.chips button[aria-pressed=true] span{color:#b9cbc9}
.stay{display:grid;grid-template-columns:repeat(3,auto);background:var(--stone);border-radius:999px;padding:4px 20px}
.stay .field{padding:2px 14px}.stay .field+.field{border-left:1px solid #d9d2c6}
.stay input{width:136px}.stay select{width:90px}
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:26px 0 8px;padding:18px 0;border-bottom:1px solid var(--line)}
.perks b{display:block;font-weight:500;font-size:15.5px}.perks span{font-size:14px;color:var(--soft)}
.count{margin:22px 0 4px;color:var(--soft);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,56px) clamp(20px,3vw,44px);margin-top:18px}
.rc{text-decoration:none;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:end}
.rc figure{aspect-ratio:3/4;border-radius:var(--arch)}
.rc img{transition:transform .8s ease}.rc:hover img{transform:scale(1.04)}
.rc .n{position:absolute;right:10px;bottom:10px;background:#0e2f33cc;color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
.rc h2{font-size:clamp(26px,2.6vw,34px)}
.rc .s{color:#3b4747;font-size:15.5px;margin:8px 0 12px}
.rc .p{margin-top:14px}.rc .p b{font:400 28px Gloock,serif;white-space:nowrap}.rc .p s{color:var(--soft);font-size:14px;margin-left:6px}
.rc .go{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-size:15px;border-bottom:1px solid var(--ink);padding-bottom:2px}
.rc:hover .go{color:var(--sun);border-color:var(--sun)}
.empty{padding:60px 0;text-align:center;color:var(--soft)}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.rc{grid-template-columns:minmax(0,4fr) minmax(0,6fr)}}
@media(max-width:820px){.stay{width:100%;grid-template-columns:1fr 1fr auto;padding:4px 12px}.stay input,.stay select{width:100%}.perks{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.rc{grid-template-columns:1fr}.rc figure{aspect-ratio:4/4.2}.stay{grid-template-columns:1fr 1fr;border-radius:20px}.stay .field:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid #d9d2c6}.perks{display:none}}
</style>
</head>
<body>
<header id="hdr"></header>

<header class="top"><div class="wrap">
  <p class="kick" data-t="listKick"></p>
  <h1 data-t="listH"></h1>
  <p class="body" data-t="listP"></p>
</div></header>

<div class="bar"><div class="wrap bi">
  <div class="chips" id="chips" role="group" aria-label="Room categories"></div>
  <form class="stay" onsubmit="return false">
    <div class="field"><label for="ci" data-t="ci"></label><input type="date" id="ci"></div>
    <div class="field"><label for="co" data-t="co"></label><input type="date" id="co"></div>
    <div class="field"><label for="gu" data-t="gu"></label><select id="gu"></select></div>
  </form>
</div></div>

<main class="wrap">
  <div id="offbar"></div>
  <div class="perks" id="perks"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">
  <div class="ft"><div><span class="brand"><b>NUAN</b></span><p style="margin-top:12px" data-t="addr"></p></div><p>reservations@nuan-retreat.example · 075-000-000</p></div>
  <div class="credit"><span data-t="foot"></span></div>
</div></footer>

<script src="common.js"></script>
<script>
{
/* old links like rooms.html#suite go straight to that room's page */
const h=location.hash.slice(1);
if(ROOMS.some(r=>r.id===h))location.replace("room.html?r="+h);
let cat=CATS.includes(h)?h:"all";
const refill=bindStay($("#ci"),$("#co"),$("#gu"),render);
function render(){
  header("rooms",false);onLang(render);
  const x=t();applyText();refill();
  $("#chips").innerHTML=CATS.map(c=>{const n=c==="all"?ROOMS.length:ROOMS.filter(r=>r.cats.includes(c)).length;return `<button type="button" data-c="${c}" aria-pressed="${c===cat}">${x.cats[c]}<span>${n}</span></button>`}).join("");
  $("#offbar").innerHTML=offerBar(null);
  $("#perks").innerHTML=x.perks.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span></div>`).join("");
  const list=ROOMS.filter(r=>cat==="all"||r.cats.includes(cat)),n=Math.max(nights(),1);
  $("#count").textContent=`${x.count(list.length)} · ${nights()>0?x.stay(n,fmt(S.ci),fmt(S.co)):x.errDate}`;
  $("#grid").innerHTML=list.length?list.map(r=>`<a class="rc" href="room.html?r=${r.id}"><figure><img loading="lazy" src="${U(r.gal[0][0],800)}" alt="${r.name}"><span class="n">${r.gal.length} ${x.pics}</span></figure>
    <div><h2>${r.name}</h2><p class="s">${r.short[L]}</p><div class="tags"><span>${r.size} ${x.sqm}</span><span>${x.max(r.max)}</span><span>${r.vw[L]}</span></div>
    <p class="p"><span class="small">${x.from}</span> <b>${baht(rate(r))}</b><s>${baht(r.price)}</s> <span class="small">${x.night}</span></p>${OFF&&!offerOk(OFF,r)?`<p class="small">${t().offPct(10)} · ${t().disc}</p>`:""}${status(r)[0]}<span class="go">${x.details}</span></div></a>`).join(""):`<p class="empty">${x.empty}</p>`;
}
$("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;history.replaceState(null,"",cat==="all"?"rooms.html":"#"+cat);render()};
window.__rerender=render;render();
}
</script>
</body>
</html>
