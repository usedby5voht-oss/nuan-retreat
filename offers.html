<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offers · Nuan Retreat Krabi</title>
<meta name="description" content="Nuan Retreat — a small 24-room retreat in Ao Nang, Krabi. Demo website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Offers: hero, the direct-booking promise, then each package as a wide row with its photo in an arch. */
.std{display:flex;gap:10px 24px;flex-wrap:wrap;margin-top:26px;font-size:15px;color:#E3E8E5}
.std b{font-weight:500;color:var(--brass2)}
.olist{display:grid;gap:clamp(64px,9vw,128px)}
.og{scroll-margin-top:170px}.og+.og{margin-top:clamp(90px,11vw,160px);padding-top:clamp(56px,7vw,96px);border-top:1px solid var(--line)}
.ogh{margin-bottom:clamp(40px,5vw,64px)}
.ogh h2{font-size:clamp(34px,4.2vw,58px)}
.of{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(36px,6vw,100px);align-items:center;scroll-margin-top:120px}
.of:nth-child(even) figure{order:2}
.of figure{aspect-ratio:4/4.2;border-radius:var(--arch)}
.of .pct{display:inline-block;background:var(--brass);color:var(--night);padding:6px 16px;font-size:14px;font-weight:500;margin-bottom:20px}
.of h2{font-size:clamp(34px,3.8vw,54px)}
.of .d{color:var(--mute);margin:16px 0 24px;max-width:46ch;font-size:17px}
.ck{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
.ck li{display:flex;gap:12px;align-items:baseline;font-size:15.5px}
.ck li::before{content:"";flex:none;width:8px;height:10px;border:1.2px solid var(--brass);border-bottom:0;border-radius:var(--arch);transform:translateY(1px)}
.terms{font-size:14px;color:var(--mute);margin:16px 0 26px;padding-top:16px;border-top:1px solid var(--line)}
.of.hl figure{outline:1px solid var(--brass);outline-offset:10px}
.ex{font-size:15px;background:#fff;border-left:3px solid var(--brass);padding:12px 16px;margin-bottom:24px}
@media(max-width:860px){.of{grid-template-columns:1fr}.of:nth-child(even) figure{order:0}.of figure{aspect-ratio:4/3.6}}
</style>
</head>
<body>
<header id="hdr"></header>
<section class="ph"><img src="https://images.unsplash.com/photo-1483683804023-6ccdb62f86ef?auto=format&fit=crop&w=2000&q=80" alt="" fetchpriority="high"><div class="wrap"><p class="crumb"><a href="index.html" data-t="navHome"></a> / <span id="crumb"></span></p><h1 id="h1"></h1><p class="lead" id="lead"></p><div class="std" id="std"></div></div></section>
<nav class="fnav" aria-label="Offers"><div class="wrap" id="onav"></div></nav>
<main class="sec"><div class="wrap" id="list"></div></main>
<script src="common.js"></script>
<script>
{
const P={th:{h1:"คุ้มกว่าเมื่อจองตรงกับเรา",lead:"เลือกแพ็กเกจที่ตรงกับทริปของคุณ แล้วไปเลือกห้องได้เลย ส่วนลดจะถูกคำนวณให้ในหน้าห้องพักและหน้าชำระเงินโดยอัตโนมัติ",
 std:"ทุกการจองตรงได้อย่างน้อย",stdB:"ลด 10% + อาหารเช้าฟรี",ex:(a,b)=>`ตัวอย่าง: Andaman Suite 3 คืน จาก ${a} เหลือ ${b}`,go:"เลือกแพ็กเกจนี้และดูห้อง",on:"กำลังใช้แพ็กเกจนี้"},
 en:{h1:"More when you book with us",lead:"Pick the package that fits your trip, then choose a room. The discount is worked out for you on the room and payment pages.",
 std:"Every direct booking gets at least",stdB:"10% off + free breakfast",ex:(a,b)=>`Example: Andaman Suite, 3 nights, from ${a} to ${b}`,go:"Choose this package and see rooms",on:"This package is applied"}};
function render(){
  header("offers",true);onLang(render);applyText();
  const p=P[L],x=t();
  $("#crumb").textContent=x.nav.offers;$("#h1").textContent=p.h1;$("#lead").textContent=p.lead;
  $("#std").innerHTML=`<span>${p.std} <b>${p.stdB}</b></span>`;
  const su=ROOMS.find(r=>r.id==="suite");
  const card=o=>{const full=su.price*3,after=Math.round(su.price*(1-o.pct))*3,okSuite=!o.rooms||o.rooms.includes("suite");
    return `<article class="of rv" id="${o.id}"><figure><img loading="lazy" src="${U(o.img,1200)}" alt=""></figure><div>
    <span class="pct">${x.offPct(Math.round(o.pct*100))}</span><h2>${o.n[L]}</h2><p class="d">${o.d[L]}</p>
    <ul class="ck">${o.perks[L].map(k=>`<li>${k}</li>`).join("")}</ul>
    <p class="terms">${offTerms(o).join(" · ")} · ${x.oValid}</p>
    ${okSuite&&!o.adv?`<p class="ex">${p.ex(baht(full),baht(after))}</p>`:""}
    <div>${OFF&&OFF.id===o.id?`<span class="btn line" style="cursor:default">${p.on}</span> <a class="btn" href="rooms.html">${x.nav.rooms}</a>`:`<a class="btn gold" href="rooms.html?offer=${o.id}" data-pick="${o.id}">${p.go}</a>`}</div>
    </div></article>`};
  $("#list").innerHTML=[["sp",x.offSp],["se",x.offSe],["st",x.offSt]].map(([k,h])=>`<section class="og" id="g-${k}"><div class="ogh"><span class="mark"></span><h2>${h}</h2></div><div class="olist">${OFFERS.filter(o=>o.type===k).map(card).join("")}</div></section>`).join("");
  $("#onav").innerHTML=[["sp",x.offSp],["se",x.offSe],["st",x.offSt]].map(([k,h])=>`<a href="#g-${k}">${h}</a>`).join("");
  document.querySelectorAll("[data-pick]").forEach(a=>a.onclick=()=>{setOffer(a.dataset.pick);
    const o=OFF;if(o.adv&&S.ci<addDays(null,o.adv)){S.ci=addDays(null,o.adv+1);S.co=addDays(S.ci,Math.max(o.minN,2))}
    if(o.within&&S.ci>addDays(null,o.within)){S.ci=addDays(null,2);S.co=addDays(S.ci,Math.max(o.minN,2))}
    if(o.when&&!o.when(S.ci)){S.ci=o.start();S.co=addDays(S.ci,Math.max(o.minN,2))}
    if(nights()<o.minN)S.co=addDays(S.ci,o.minN);saveS()});
  reveal();
  const h=location.hash.slice(1),el=h&&document.getElementById(h);if(el){el.classList.add("hl");setTimeout(()=>el.scrollIntoView(),60)}
}
window.__rerender=render;render();
}
</script>
</body>
</html>
