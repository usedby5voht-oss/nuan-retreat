<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room · Nuan Retreat Krabi</title>
<meta name="description" content="Nuan Retreat — a small 24-room retreat in Ao Nang, Krabi. Demo website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Room detail: gallery under a solid header, details on the left, a pinned booking card on the right. */
.crumb2{padding:28px 0 0;font-size:13.5px;color:var(--mute)}
.crumb2 a{color:var(--mute);text-decoration:none}.crumb2 a:hover{color:var(--ink)}
.gal{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:14px;margin-top:20px}
.main{aspect-ratio:4/3.1;border-radius:var(--arch);cursor:zoom-in;border:0;padding:0;background:var(--stone);overflow:hidden;position:relative;display:block;width:100%}
.main .cap{position:absolute;left:18px;bottom:18px;background:#0F1D1Acc;color:#fff;font-size:13px;padding:4px 14px;white-space:nowrap}
.side{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px}
.thumb{border:0;padding:0;overflow:hidden;cursor:pointer;position:relative;background:var(--stone);min-height:0}
.thumb img{transition:transform .8s ease}.thumb:hover img{transform:scale(1.05)}
.thumb .plus{position:absolute;inset:0;display:grid;place-items:center;background:#0F1D1Ab3;color:#fff;font-size:14.5px;text-align:center;padding:8px}
.lay{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(40px,6vw,96px);margin-top:clamp(40px,5vw,64px);align-items:start}
.lay h1{font-size:clamp(42px,5vw,72px)}
.lay .tags{margin:20px 0 10px}
.blk{padding:40px 0;border-top:1px solid var(--line);margin-top:30px}
.blk+.blk{margin-top:0}
.blk h2{font-size:clamp(26px,2.4vw,34px);margin-bottom:18px}
.blk p+p{margin-top:14px}
.blk p{color:var(--mute);max-width:62ch}
.am{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 26px;font-size:15.5px}
.am li{display:flex;gap:12px;align-items:baseline}
.am li::before{content:"";flex:none;width:8px;height:10px;border:1.2px solid var(--brass);border-bottom:0;border-radius:var(--arch);transform:translateY(1px)}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.spec div{background:var(--paper);padding:16px 18px}
.spec span{display:block;font-size:13px;color:var(--mute)}.spec b{font-weight:500}
.pg{display:grid;gap:18px}.pg b{display:block;font-weight:500}.pg p{font-size:15.5px}
.bk{position:sticky;top:calc(var(--navh,84px) + 22px);background:#fff;border:1px solid var(--line);padding:30px;box-shadow:0 30px 60px -36px #0F1D1A55}
.bk .price b{font:300 42px/1.1 var(--f-d)}.bk .price s{color:var(--mute);font-size:14px;margin-left:8px}
.bk .stay{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:20px 0 8px}
.bk .field{padding:10px 14px}.bk .field+.field{border-left:1px solid var(--line)}
.bk .field:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
.bd{margin:16px 0 6px;font-size:15px}
.bd div{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.bd span:last-child{white-space:nowrap}
.bd .tot{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:500;font-size:17px}
.bk .note{font-size:13px;color:var(--mute);text-align:center;margin-top:12px}
.nf{padding:120px 0;text-align:center}.nf h1{margin-bottom:24px}
@media(max-width:960px){.lay{grid-template-columns:1fr}.bk{position:static}.am{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.gal{grid-template-columns:1fr}.main{aspect-ratio:4/4}.side{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:auto}.thumb{aspect-ratio:1}.am{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="hdr"></header>
<main class="wrap" id="page"></main>
<section class="sec dark" id="more" hidden><div class="wrap"><div class="sh"><div><span class="mark"></span><h2 id="moreH"></h2></div></div><div class="card3" id="moreL"></div></div></section>
<dialog id="dlg" aria-label="Booking"><div class="dl" id="dlgBody"></div></dialog>
<script src="common.js"></script>
<script>
{
const id=new URLSearchParams(location.search).get("r");
const R=ROOMS.find(r=>r.id===id);
let cur=0;
function render(){
  header("rooms",false);onLang(render);
  const x=t();applyText();
  if(!R){$("#page").innerHTML=`<div class="nf"><h1>${x.notFound}</h1><a class="btn" href="rooms.html">${x.backList}</a></div>`;return}
  document.title=`${R.name} · Nuan Retreat Krabi`;
  const g=R.gal,n=Math.max(nights(),1),d=rate(R),[st,bad]=status(R);
  const side=g.slice(1,5).map((p,i)=>`<button class="thumb" data-i="${i+1}" aria-label="${p[1][L]}"><img src="${U(p[0],600)}" alt="${p[1][L]}">${i===3&&g.length>5?`<span class="plus">${x.photos(g.length)}</span>`:""}</button>`).join("");
  $("#page").innerHTML=`<p class="crumb2"><a href="index.html">${x.navHome}</a> / <a href="rooms.html">${x.crumb}</a> / ${R.name}</p>
  <div class="gal"><button class="main" data-i="0" aria-label="${x.photos(g.length)}"><img src="${U(g[0][0],1600)}" alt="${g[0][1][L]}"><span class="cap">${x.photos(g.length)}</span></button><div class="side">${side}</div></div>
  <div class="lay"><div>
    <h1>${R.name}</h1><p class="lead" style="margin-top:14px">${R.short[L]}</p>
    <div class="tags"><span>${R.size} ${x.sqm}</span><span>${x.max(R.max)}</span><span>${R.bed[L]}</span><span>${R.vw[L]}</span><span>${R.fl[L]}</span></div>
    <section class="blk"><h2>${x.aboutH}</h2>${R.long[L].map(p=>`<p>${p}</p>`).join("")}</section>
    <section class="blk"><h2>${x.amH}</h2><ul class="am">${R.am[L].map(a=>`<li>${a}</li>`).join("")}</ul></section>
    <section class="blk"><h2>${x.specH}</h2><div class="spec"><div><span>${x.spec.size}</span><b>${R.size} ${x.sqm}</b></div><div><span>${x.spec.bed}</span><b>${R.bed[L]}</b></div><div><span>${x.spec.max}</span><b>${x.max(R.max)}</b></div><div><span>${x.spec.view}</span><b>${R.vw[L]}</b></div><div><span>${x.spec.floor}</span><b>${R.fl[L]}</b></div></div></section>
    <section class="blk"><h2>${x.polH}</h2><div class="pg">${x.pol.map(p=>`<div><b>${p[0]}</b><p>${p[1]}</p></div>`).join("")}</div></section>
  </div>
  <aside class="bk" aria-label="${x.bookH}">${offerBar(R)}
    <p class="price" style="margin-top:6px"><span class="small">${x.night}</span><br><b>${baht(d)}</b><s>${baht(R.price)}</s></p>
    <form class="stay" onsubmit="return false"><div class="field"><label for="ci">${x.ci}</label><input type="date" id="ci"></div><div class="field"><label for="co">${x.co}</label><input type="date" id="co"></div><div class="field"><label for="gu">${x.gu}</label><select id="gu"></select></div></form>
    <div class="bd"><div><span>${baht(R.price)} × ${n} ${x.nights}</span><span>${baht(R.price*n)}</span></div><div><span>${discLabel(R)}</span><span>−${baht((R.price-d)*n)}</span></div><div class="tot"><span>${x.total}</span><span>${baht(d*n)}</span></div></div>
    ${st}<button class="btn gold wide" id="book" ${bad?"disabled":""}>${x.bookBtn}</button><p class="note">${x.bookNote}</p>
  </aside></div><div style="height:clamp(60px,8vw,110px)"></div>`;
  $("#more").hidden=false;$("#moreH").textContent=x.moreH;
  $("#moreL").innerHTML=ROOMS.filter(r=>r.id!==R.id).map(r=>`<a class="xc arc" href="room.html?r=${r.id}"><figure><img loading="lazy" src="${U(r.gal[0][0],800)}" alt="${r.name}"></figure><p class="meta">${x.from} ${baht(rate(r))} ${x.night}</p><h3>${r.name}</h3><p>${r.short[L]}</p></a>`).join("");
  bindStay($("#ci"),$("#co"),$("#gu"),render);
  $("#book").onclick=()=>openBook(R);
  const list=g.map(p=>[p[0],p[1][L]]);
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>viewer(list,+b.dataset.i));
  navH();
}
window.__rerender=render;render();
}
</script>
</body>
</html>
